<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Administração · Sugestões para as redes</title>
<meta name="theme-color" content="#170f33">
<link rel="icon" type="image/png" href="/selo-arcadia.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Lora:ital,wght@0,400;0,500;0,600;1,500&family=Nunito+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/fx.css">
<link rel="stylesheet" href="/leitura/leitura.css">
<link rel="stylesheet" href="/livros/livros.css">
<link rel="stylesheet" href="../redes.css">
</head>
<body>
<div class="scene" id="scene" aria-hidden="true" style="background-image:none"><div class="art" id="art"></div></div>
<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="petals" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<main class="wrap">
  <div class="row" style="justify-content:space-between"><a class="back" href="../">← Sugestões para as redes</a><a class="back" href="/admin/">Painel da administração</a></div>
  <section class="panel arch">
    <div class="top">
      <img class="seal" src="/selo-arcadia.png" alt="" width="72" height="72">
      <p class="lbl">Sugestões para as redes sociais</p>
      <h1>Administração</h1>
    </div>
    <div id="state" style="margin-top:14px;text-align:center"><p class="muted">Carregando…</p></div>
  </section>

  <div id="area" hidden style="display:flex;flex-direction:column;gap:16px">
    <section class="panel">
      <p class="lbl">Para avaliar</p>
      <h2>Recebidas<span class="badge" id="recN" hidden></span></h2>
      <ul class="sugs" id="rec"><li class="muted small">Carregando…</li></ul>
    </section>
    <section class="panel">
      <p class="lbl">Para publicar</p>
      <h2>Aprovadas<span class="badge" id="aprN" hidden></span></h2>
      <ul class="sugs" id="apr"></ul>
    </section>
    <section class="panel">
      <p class="lbl">Histórico</p>
      <h2>Publicadas</h2>
      <ul class="sugs" id="pub"></ul>
    </section>
    <div class="row" style="justify-content:center"><button class="btn ghost" type="button" id="sair">Sair da conta</button></div>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>window.ARC_SET={largo:'banner',alto:'frame'}</script>
<script src="/fx.js"></script>
<script src="/config.js"></script>
<script src="/sprint/config.js"></script>
<script src="/livros/comum.js"></script>
<script src="../comum.js"></script>
<script>
(async function(){
  const $=id=>document.getElementById(id),st=$('state');
  const L=window.LIVROS,{esc}=L,R=window.REDES;
  const CFG=window.ARCADIA_CONFIG||{};
  let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2800)}
  const data=ts=>ts&&ts.toDate?ts.toDate().toLocaleDateString('pt-BR'):'';

  const load=src=>new Promise((ok,no)=>{const sc=document.createElement('script');sc.src=src;sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
  const V='10.12.2';
  try{await load(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);await load(`https://www.gstatic.com/firebasejs/${V}/firebase-auth-compat.js`);await load(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore-compat.js`)}
  catch(e){st.innerHTML='<p class="muted">Sem conexão agora. Recarregue a página.</p>';return}
  // app separado: o login de administração não mexe no acesso de integrante deste aparelho
  const app=firebase.initializeApp(window.ARCADIA_FIREBASE||CFG.firebase,'admin');const auth=app.auth(),db=app.firestore();
  const FV=firebase.firestore.FieldValue;
  try{await auth.getRedirectResult()}catch(e){console.warn(e)}

  function login(){$('area').hidden=true;
    st.innerHTML='<p>Esta parte é só para a administração do clube.</p><button class="btn" id="g">Entrar com Google</button>';
    $('g').onclick=async()=>{const p=new firebase.auth.GoogleAuthProvider();try{await auth.signInWithPopup(p)}
      catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')auth.signInWithRedirect(p);
        else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')st.insertAdjacentHTML('beforeend','<p class="muted small">Não foi possível entrar: '+esc(e.code)+'</p>')}}}
  $('sair').onclick=()=>auth.signOut();

  let iniciou=false;
  auth.onAuthStateChanged(async u=>{
    if(!u||u.isAnonymous)return login();
    let admin=false;try{admin=(await db.collection('admins').doc(u.uid).get()).exists}catch(e){}
    if(!admin){$('area').hidden=true;st.innerHTML='<p>Você entrou como <b>'+esc(u.email)+'</b>, mas esta conta ainda não tem acesso.</p><p class="muted small">Para liberar, no console do Firebase crie em Firestore, na coleção <code>admins</code>, um documento cujo ID é:</p><p><code style="word-break:break-all">'+esc(u.uid)+'</code></p><button class="btn ghost" id="out">Sair</button>';$('out').onclick=()=>auth.signOut();return}
    st.innerHTML='<p class="muted small" style="margin:0">Conectada como '+esc(u.email)+'</p>';$('area').hidden=false;
    if(!iniciou){iniciou=true;iniciar()}
  });

  function iniciar(){
    const col=db.collection('redes');let todas=[],editando=null;
    col.onSnapshot(s=>{todas=s.docs.map(d=>Object.assign({_id:d.id},d.data()));desenhar()},
      e=>{console.warn(e);toast('Erro ao ler as sugestões: '+e.code)});

    const nomeArq=x=>'arcadia-'+R.tipo(x.tipo)+'-'+L.slug(x.nome||'')+'-'+String(x._id).slice(0,5)+'.jpg';
    const notaTxt=x=>x.nota?'<p class="nota"><b>Recado:</b> '+esc(x.nota)+'</p>':'';
    const campoNota=x=>'<label style="margin-top:8px">Recado <small>Opcional. Quem sugeriu vê na página.</small><textarea data-nota rows="2" maxlength="'+R.MAX.nota+'">'+esc(x.nota||'')+'</textarea></label>';
    function card(x,botoes){
      return '<li class="sug '+R.cls(x.tipo)+'" data-id="'+esc(x._id)+'">'+
        '<div class="topo">'+R.tag(x.tipo)+'<span class="st '+esc(x.status)+'">'+(R.ST[x.status]||'')+'</span></div>'+
        '<p class="por">Sugerido por <b style="color:var(--cream)">'+esc(x.nome)+'</b>'+(data(x.criadoEm)?' em '+data(x.criadoEm):'')+'</p>'+
        '<p class="txt">'+esc(x.descricao)+'</p>'+
        (x.link&&R.linkOk(x.link)?'<a class="lk" href="'+esc(x.link)+'" target="_blank" rel="noopener">'+esc(x.link)+'</a>':'')+
        (x.imagem?'<a class="foto" href="'+esc(x.imagem)+'" download="'+esc(nomeArq(x))+'"><img src="'+esc(x.imagem)+'" alt="Imagem enviada" loading="lazy"></a><button class="lnk" type="button" data-acao="baixar">Baixar imagem</button>':'')+
        (editando===x._id?campoNota(x)+'<div class="acoes"><button class="btn" type="button" data-acao="salvarNota">Salvar recado</button><button class="btn ghost" type="button" data-acao="cancelar">Cancelar</button></div>'
          :notaTxt(x)+'<div class="acoes">'+botoes+'</div>'+
           '<div class="ed"><button class="lnk" type="button" data-acao="editar">'+(x.nota?'Mudar recado':'Escrever recado')+'</button>'+
           (x.status!=='recebida'?'<button class="lnk" type="button" data-acao="recebida">Voltar para recebida</button>':'')+
           '<button class="del" type="button" data-acao="apagar">Apagar</button></div>')+
        '</li>'}

    function desenhar(){
      const por=st=>todas.filter(x=>(R.ST[x.status]?x.status:'recebida')===st);
      const rec=por('recebida').sort(R.antigas),apr=por('aprovada').sort(R.antigas),pub=por('publicada').sort(R.recentes);
      $('recN').hidden=!rec.length;$('recN').textContent=rec.length;
      $('aprN').hidden=!apr.length;$('aprN').textContent=apr.length;
      $('rec').innerHTML=rec.length?rec.map(x=>card(x,'<button class="btn ok" type="button" data-acao="aprovada">Aprovar</button>')).join(''):'<li class="muted small">Nenhuma sugestão esperando.</li>';
      $('apr').innerHTML=apr.length?apr.map(x=>card(x,'<button class="btn ok" type="button" data-acao="publicada">Marcar como publicada</button>')).join(''):'<li class="muted small">Nenhuma.</li>';
      $('pub').innerHTML=pub.length?pub.map(x=>card(x,'')).join(''):'<li class="muted small">Nenhuma ainda.</li>'}

    document.addEventListener('click',async e=>{const b=e.target.closest('[data-acao]');if(!b)return;
      const li=b.closest('[data-id]');if(!li)return;const id=li.dataset.id,x=todas.find(y=>y._id===id);if(!x)return;
      const a=b.dataset.acao;
      if(a==='editar'){editando=id;desenhar();return}
      if(a==='cancelar'){editando=null;desenhar();return}
      if(a==='baixar'){const l=document.createElement('a');l.href=x.imagem;l.download=nomeArq(x);document.body.appendChild(l);l.click();l.remove();return}
      b.disabled=true;
      try{
        if(R.ST[a]){await col.doc(id).update({status:a});toast(a==='aprovada'?'Sugestão aprovada':a==='publicada'?'Marcada como publicada':'Voltou para recebida')}
        else if(a==='salvarNota'){const ta=li.querySelector('[data-nota]');await col.doc(id).update({nota:ta?ta.value.trim():''});editando=null;desenhar();toast('Recado salvo')}
        else if(a==='apagar'){if(!confirm('Apagar esta sugestão de '+x.nome+'? Ela deixa de ver.')){b.disabled=false;return}
          await col.doc(id).delete();toast('Apagada')}
      }catch(er){console.warn(er);toast('Não foi possível agora: '+er.code);b.disabled=false}});
  }
})();
</script>
</body>
</html>
