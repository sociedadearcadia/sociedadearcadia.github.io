<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Administração · Sociedade Arcádia</title>
<meta name="theme-color" content="#170f33">
<link rel="icon" type="image/png" href="/selo-arcadia.png">
<link rel="apple-touch-icon" href="/selo-arcadia.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Lora:ital,wght@0,400;0,500;0,600;1,500&family=Nunito+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/fx.css">
<link rel="stylesheet" href="/leitura/leitura.css">
<style>
.grupo{display:flex;flex-direction:column;gap:10px}
.grupo h2{margin:0 0 2px}
.atalhos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.atalhos a{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--cream);padding:13px 14px;border-radius:14px;
  background:rgba(23,15,51,.55);border:1px solid var(--line);transition:border-color .2s,background .2s}
.atalhos a:hover,.atalhos a:focus-visible{border-color:var(--gold);background:rgba(43,23,72,.75);outline:none}
.atalhos .ic{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;
  background:radial-gradient(circle at 35% 30%,rgba(232,139,214,.35),rgba(23,15,51,.8));box-shadow:0 0 0 1px rgba(214,180,108,.5)}
.atalhos .tx{display:flex;flex-direction:column;min-width:0}
.atalhos b{font:600 16px var(--display)}
.atalhos small{color:var(--muted);font-size:13px;line-height:1.35}
.atalhos .seta{margin-left:auto;color:var(--lilac);flex:none}
.busca-adm{font:16px var(--body);color:var(--cream);background:rgba(23,15,51,.75);border:1px solid var(--line);border-radius:999px;padding:11px 16px;width:100%;-webkit-appearance:none;appearance:none}
.busca-adm:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(214,180,108,.25)}
.nada{text-align:center}
</style>
</head>
<body>
<div class="scene" id="scene" aria-hidden="true" style="background-image:none"><div class="art" id="art"></div></div>
<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="petals" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<main class="wrap">
  <a class="back" href="/">← Início do site</a>
  <section class="panel arch">
    <div class="top">
      <img class="seal" src="/selo-arcadia.png" alt="" width="72" height="72">
      <p class="lbl">Sociedade Arcádia</p>
      <h1>Administração</h1>
    </div>
    <div id="state" style="margin-top:14px;text-align:center"><p class="muted">Carregando…</p></div>
  </section>

  <div id="area" hidden style="display:flex;flex-direction:column;gap:16px">
    <input class="busca-adm" type="search" id="filtro" placeholder="Procurar uma área" aria-label="Procurar uma área da administração" autocomplete="off">
    <div id="grupos" style="display:flex;flex-direction:column;gap:16px"></div>
    <section class="panel nada" id="nada" hidden><p class="muted" style="margin:0">Nenhuma área com esse nome.</p></section>
    <div class="row" style="justify-content:center"><button class="btn ghost" type="button" id="sair">Sair da conta</button></div>
  </div>
</main>

<script>window.ARC_SET={largo:'banner',alto:'frame'}</script>
<script src="/fx.js"></script>
<script src="/config.js"></script>
<script>
(async function(){
  const $=id=>document.getElementById(id),st=$('state');
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  /* Todas as áreas de administração do site. Página nova de administração: acrescente uma linha aqui. */
  const GRUPOS=[
    {t:'Leitura do mês',itens:[
      {ic:'📖',n:'Livro do mês e questionário',d:'Definir o livro, sortear, acompanhar a leitura e o questionário',u:'/leitura/admin/'},
      {ic:'🗳️',n:'Votação do livro do mês',d:'Criar votação, ver contagem e quem votou',u:'/votacao/admin/'},
      {ic:'📚',n:'Livros sugeridos e LCs',d:'Aprovar sugestões, lista oficial e LCs extras',u:'/livros/admin/'}]},
    {t:'Encontros e jogos',itens:[
      {ic:'🗓️',n:'Agenda',d:'Adicionar encontros e ver confirmações',u:'/agenda/admin/'},
      {ic:'💡',n:'Ideias de encontros',d:'Aprovar ou recusar ideias',u:'/ideias/admin/'},
      {ic:'👑',n:'Arcadiana do Ano',d:'Lançar pontos e ver o ranking',u:'/arcadiana/admin/'},
      {ic:'🎲',n:'Bingo',d:'Tabela, cartelas, códigos e provas para conferir',u:'/bingo/admin/'}]},
    {t:'Divulgação',itens:[
      {ic:'✨',n:'Sugestões para as redes',d:'Avaliar e marcar como publicadas',u:'/redes/admin/'},
      {ic:'🖼️',n:'Artes do clube',d:'Adicionar ou tirar artes da galeria',u:'/artes/admin/'},
      {ic:'✉️',n:'Respostas da lista de espera',d:'Ver quem quer entrar no clube',u:'/lista-de-espera/respostas/'}]},
    {t:'Fora do site',itens:[
      {ic:'🔥',n:'Firebase',d:'Dados, regras e quem é administradora',u:'https://console.firebase.google.com/project/sprint-arcadia/firestore',ext:1},
      {ic:'🐙',n:'GitHub do clube',d:'Pedidos de alteração do site (PRs)',u:'https://github.com/sociedadearcadia',ext:1}]}
  ];

  function desenhar(q){
    q=(q||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
    let total=0;
    $('grupos').innerHTML=GRUPOS.map(g=>{
      const its=g.itens.filter(i=>!q||(i.n+' '+i.d+' '+g.t).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().includes(q));
      total+=its.length;if(!its.length)return'';
      return '<section class="panel grupo"><p class="lbl">'+esc(g.t)+'</p><ul class="atalhos">'+its.map(i=>
        '<li><a href="'+esc(i.u)+'"'+(i.ext?' target="_blank" rel="noopener"':'')+'><span class="ic" aria-hidden="true">'+i.ic+'</span>'+
        '<span class="tx"><b>'+esc(i.n)+'</b><small>'+esc(i.d)+'</small></span><span class="seta" aria-hidden="true">'+(i.ext?'↗':'›')+'</span></a></li>').join('')+'</ul></section>'}).join('');
    $('nada').hidden=total>0}
  $('filtro').addEventListener('input',e=>desenhar(e.target.value));

  const load=src=>new Promise((ok,no)=>{const sc=document.createElement('script');sc.src=src;sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
  const FBV='10.12.2';
  try{await load(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app-compat.js`);await load(`https://www.gstatic.com/firebasejs/${FBV}/firebase-auth-compat.js`);await load(`https://www.gstatic.com/firebasejs/${FBV}/firebase-firestore-compat.js`)}
  catch(e){st.innerHTML='<p class="muted">Sem conexão agora. Recarregue a página.</p>';return}
  // mesmo login das outras páginas de administração (app 'admin'), então entrar aqui vale para todas
  const app=firebase.initializeApp(window.ARCADIA_FIREBASE,'admin');const auth=app.auth(),db=app.firestore();
  try{await auth.getRedirectResult()}catch(e){console.warn(e)}

  function login(){$('area').hidden=true;
    st.innerHTML='<p>Esta parte é só para a administração do clube.</p><button class="btn" id="g">Entrar com Google</button>';
    $('g').onclick=async()=>{const p=new firebase.auth.GoogleAuthProvider();try{await auth.signInWithPopup(p)}
      catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')auth.signInWithRedirect(p);
        else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')st.insertAdjacentHTML('beforeend','<p class="muted small">Não foi possível entrar: '+esc(e.code)+'</p>')}}}
  $('sair').onclick=()=>auth.signOut();

  auth.onAuthStateChanged(async u=>{
    if(!u||u.isAnonymous)return login();
    let admin=false;try{admin=(await db.collection('admins').doc(u.uid).get()).exists}catch(e){}
    if(!admin){$('area').hidden=true;st.innerHTML='<p>Você entrou como <b>'+esc(u.email)+'</b>, mas esta conta não tem acesso à administração.</p><button class="btn ghost" id="out">Sair</button>';$('out').onclick=()=>auth.signOut();return}
    st.innerHTML='<p class="muted small" style="margin:0">Conectada como '+esc(u.email)+'</p>';
    desenhar('');$('area').hidden=false;
  });
})();
</script>
</body>
</html>
