<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Online · Administração · Estante do clube</title>
<meta name="theme-color" content="#170f33">
<link rel="icon" type="image/png" href="/selo-arcadia.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Lora:ital,wght@0,400;0,500;0,600;1,500&family=Nunito+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/fx.css">
<link rel="stylesheet" href="/online/leitura/leitura.css">
<link rel="stylesheet" href="/online/livros/livros.css">
<link rel="stylesheet" href="../estante.css">
</head>
<body>
<div class="scene" id="scene" aria-hidden="true" style="background-image:none"><div class="art" id="art"></div></div>
<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="petals" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<main class="wrap">
  <p class="turma-adm" style="align-self:center;width:max-content;max-width:100%;margin:0 auto 4px;padding:5px 14px;border:1px solid rgba(214,180,108,.55);border-radius:999px;font:700 12px/1.3 'Nunito Sans',system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#e7c987;background:rgba(23,15,51,.6)">Administração online</p>
  <div class="row" style="justify-content:space-between"><a class="back" href="../">← Estante do clube</a><a class="back" href="/online/admin/">Painel da administração</a></div>
  <section class="panel arch">
    <div class="top">
      <img class="seal" src="/selo-arcadia.png" alt="" width="72" height="72">
      <p class="lbl">Notas dos livros do mês</p>
      <h1>Administração</h1>
    </div>
    <div id="state" style="margin-top:14px;text-align:center"><p class="muted">Carregando…</p></div>
  </section>
  <div id="area" hidden style="display:flex;flex-direction:column;gap:16px">
    <section class="panel">
      <p class="lbl">Só você vê</p>
      <h2>Nota de cada integrante</h2>
      <p class="muted small" style="margin:-6px 0 12px">As integrantes veem só a média. Apagar uma nota deixa a pessoa dar a nota de novo (por exemplo, se trocou de celular).</p>
      <ul class="estante" id="lista"><li class="muted small">Carregando…</li></ul>
    </section>
    <div class="row" style="justify-content:center"><button class="btn ghost" type="button" id="sair">Sair da conta</button></div>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>window.ARC_SET={largo:'banner',alto:'frame'}</script>
<script src="/fx.js"></script>
<script src="/online/config.js"></script>
<script src="/online/sprint/config.js"></script>
<script src="/online/livros/comum.js"></script>
<script>
(async function(){
  const $=id=>document.getElementById(id),st=$('state');
  const L=window.LIVROS,{esc,slug}=L;
  const CFG=window.ARCADIA_CONFIG||{};
  const MEMBROS=(CFG.membros||[]).map(String);
  let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2800)}

  const load=src=>new Promise((ok,no)=>{const sc=document.createElement('script');sc.src=src;sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
  const V='10.12.2';
  try{await load(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);await load(`https://www.gstatic.com/firebasejs/${V}/firebase-auth-compat.js`);await load(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore-compat.js`)}
  catch(e){st.innerHTML='<p class="muted">Sem conexão agora. Recarregue a página.</p>';return}
  // app separado: o login de administração não mexe no acesso de integrante deste aparelho
  const app=firebase.initializeApp(window.ARCADIA_FIREBASE||CFG.firebase,'admin');const auth=app.auth(),db=app.firestore();
  try{await auth.getRedirectResult()}catch(e){console.warn(e)}

  function login(){$('area').hidden=true;
    st.innerHTML='<p>Esta parte é só para a administração do clube.</p><button class="btn" id="g">Entrar com Google</button>';
    $('g').onclick=async()=>{const p=new firebase.auth.GoogleAuthProvider();try{await auth.signInWithPopup(p)}
      catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')auth.signInWithRedirect(p);
        else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')st.insertAdjacentHTML('beforeend','<p class="muted small">Não foi possível entrar: '+esc(e.code)+'</p>')}}}
  $('sair').onclick=()=>auth.signOut();

  let iniciou=false;
  auth.onAuthStateChanged(async u=>{
    if(!u||u.isAnonymous)return login();
    // só a administração principal
    let admin=false;try{admin=(await db.collection('admins').doc(u.uid).get()).exists}catch(e){}
    if(!admin){$('area').hidden=true;st.innerHTML='<p>Você entrou como <b>'+esc(u.email)+'</b>, mas esta conta não tem acesso a esta página.</p><button class="btn ghost" id="out">Sair</button>';$('out').onclick=()=>auth.signOut();return}
    st.innerHTML='<p class="muted small" style="margin:0">Conectada como '+esc(u.email)+'</p>';$('area').hidden=false;
    if(!iniciou){iniciou=true;iniciar()}
  });

  function iniciar(){
    let livros=[],notas={},offs={};
    const fmt=v=>v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
    function desenhar(){
      if(!livros.length){$('lista').innerHTML='<li class="muted small">Nenhum livro ainda.</li>';return}
      $('lista').innerHTML=livros.map(l=>{
        const ns=Object.entries(notas[l._id]||{}).map(([k,v])=>Object.assign({_k:k},v)).sort((a,b)=>String(a.nome).localeCompare(String(b.nome)));
        const m=ns.length?ns.reduce((a,x)=>a+(+x.nota||0),0)/ns.length:0;
        const falta=MEMBROS.filter(n=>!ns.some(x=>x._k===slug(n)));
        return '<li class="lv" data-id="'+esc(l._id)+'"><div class="bd">'+
          (l.mes?'<p class="mes">'+esc(l.mes)+'</p>':'')+'<h3>'+esc(l.titulo)+'</h3>'+
          '<div class="media">'+(ns.length?'<b>'+fmt(m)+' ★</b><span>'+ns.length+(ns.length===1?' nota':' notas')+'</span>':'<span>Ainda sem notas</span>')+'</div>'+
          (ns.length?'<ul class="minhas" style="margin-top:6px">'+ns.map(x=>'<li><span>'+esc(x.nome)+': <b>'+'★'.repeat(+x.nota||0)+'</b></span><button class="del" type="button" data-k="'+esc(x._k)+'">Apagar</button></li>').join('')+'</ul>':'')+
          (ns.length&&falta.length?'<p class="muted small" style="margin:6px 0 0">Ainda não deram nota: '+falta.map(esc).join(', ')+'</p>':'')+
          '</div></li>'}).join('')}
    db.collection('leituras').orderBy('inicio','desc').onSnapshot(s=>{
      livros=s.docs.map(d=>Object.assign({_id:d.id},d.data()));
      livros.forEach(l=>{if(offs[l._id])return;
        offs[l._id]=db.collection('leituras').doc(l._id).collection('avaliacoes').onSnapshot(a=>{notas[l._id]={};a.docs.forEach(d=>notas[l._id][d.id]=d.data());desenhar()},e=>console.warn(e))});
      desenhar()},e=>{console.warn(e);toast('Erro ao ler: '+e.code)});
    $('lista').addEventListener('click',async e=>{const b=e.target.closest('[data-k]');if(!b)return;
      const id=b.closest('[data-id]').dataset.id,k=b.dataset.k,x=(notas[id]||{})[k]||{};
      if(!confirm('Apagar a nota de '+(x.nome||k)+'? Ela poderá dar a nota de novo.'))return;
      b.disabled=true;
      try{await db.collection('leituras').doc(id).collection('avaliacoes').doc(k).delete();toast('Nota apagada')}
      catch(er){console.warn(er);toast('Não foi possível agora: '+er.code);b.disabled=false}});
  }
})();
</script>
</body>
</html>
