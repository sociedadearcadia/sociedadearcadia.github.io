<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Online · Área das integrantes · Sociedade Arcádia</title>
<meta name="theme-color" content="#170f33">
<link rel="icon" type="image/png" href="/selo-arcadia.png">
<link rel="apple-touch-icon" href="/app-icone-apple.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arcádia">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Lora:ital,wght@0,400;0,500;0,600;1,500&family=Nunito+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/fx.css">
<link rel="stylesheet" href="/online/leitura/leitura.css">
<style>
.grupo{display:flex;flex-direction:column;gap:10px}
.grupo h2{margin:0 0 2px}
.atalhos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.atalhos a{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--cream);padding:13px 14px;border-radius:14px;
  background:rgba(23,15,51,.55);border:1px solid var(--line);transition:border-color .2s,background .2s}
.atalhos a:hover,.atalhos a:focus-visible{border-color:var(--gold);background:rgba(43,23,72,.75);outline:none}
.atalhos .ic{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;
  background:radial-gradient(circle at 35% 30%,rgba(120,72,190,.55),rgba(23,15,51,.92) 70%);box-shadow:0 0 0 1px rgba(214,180,108,.55),inset 0 0 8px rgba(214,180,108,.18)}
.atalhos .tx{display:flex;flex-direction:column;min-width:0}
.atalhos b{font:600 16px var(--display)}
.atalhos small{color:var(--muted);font-size:13px;line-height:1.35}
.atalhos .seta{margin-left:auto;color:var(--lilac);flex:none}
.atalhos .novo{margin-left:auto;flex:none;font:700 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--night);background:#bff0d2;border-radius:999px;padding:3px 9px}
.atalhos .novo+.seta{margin-left:6px}
.fora{text-align:center;margin-top:14px}
.fora a{color:var(--lilac)}
</style>
</head>
<body>
<div class="scene" id="scene" aria-hidden="true" style="background-image:none"><div class="art" id="art"></div></div>
<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="petals" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<main class="wrap">
  <a class="back" href="/">← Sociedade Arcádia</a>
  <section class="panel arch">
    <div class="top">
      <img class="seal" src="/selo-arcadia.png" alt="Selo da Sociedade Arcádia" width="72" height="72">
      <p class="lbl">Só para quem faz parte</p>
      <h1>Área das integrantes</h1><p class="lbl" style="margin-top:6px">Online</p>
    </div>
    <p class="muted" id="estado" style="text-align:center;margin:12px 0 0">Carregando…</p>
  </section>
  <div id="grupos" hidden style="display:flex;flex-direction:column;gap:16px"></div>
</main>

<div class="gate" id="gate" hidden>
  <form class="panel arch" id="gateForm">
    <img class="seal" src="/selo-arcadia.png" alt="" width="72" height="72">
    <p class="lbl" style="margin-top:14px">Só para integrantes</p>
    <h2 style="margin-top:6px">Senha do clube online</h2>
    <p class="muted small">É a senha das integrantes online, a mesma do sprint online. Você só precisa digitar uma vez neste aparelho.</p>
    <div class="form">
      <input type="password" id="gateInput" autocomplete="current-password" maxlength="60" aria-label="Senha do clube" required>
      <p class="err" id="gateErr" hidden></p>
      <button class="btn wide" type="submit" id="gateBtn">Entrar</button>
    </div>
    <p class="muted small fora">Ainda não faz parte? <a href="/lista-de-espera/?m=online">Entre na lista de espera</a></p>
  </form>
</div>

<script>window.ARC_SET={largo:'banner',alto:'frame'}</script>
<script src="/fx.js"></script>
<script src="/online/config.js"></script>
<script src="/icones.js"></script>
<script src="/instalar.js"></script>
<script>
(async function(){
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const LS={get(k,d){try{const v=localStorage.getItem('arcadiaOnline:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('arcadiaOnline:'+k,JSON.stringify(v))}catch(e){}}};
  /* para incluir uma página nova, coloque uma linha no grupo certo */
  const GRUPOS=[
    {t:'Nosso clube',itens:[
      {ic:'pergaminho',n:'Código da Sociedade Arcádia',d:'Nossos combinados e como o clube funciona',u:'/online/codigo/'}]},
    {t:'Leitura do mês',itens:[
      {ic:'livro',n:'Atualização de leitura',d:'Quanto você já leu do livro do mês',u:'/online/leitura/'},
      {ic:'pergunta',n:'Questionário do mês',d:'Perguntas sobre o livro do mês',u:'/online/leitura/questionario/'},
      {ic:'lacre',n:'Cartas Seladas',d:'Lacre sua teoria sobre o livro e abra junto com todas',u:'/online/cartas/'},
      {ic:'estrela',n:'Estante do clube',d:'Livros já lidos e a nota de cada um',u:'/online/estante/'},
      {ic:'carta',n:'Votação do livro do mês',d:'Escolha entre os livros sorteados',u:'/online/votacao/'},
      {ic:'estante',n:'Livros sugeridos',d:'Lista para o sorteio e as LCs extras',u:'/online/livros/'},
      {ic:'vassoura',n:'Limpeza da lista de livros',d:'Marque os livros que você não leria',u:'/online/limpeza/',limpeza:1}]},
    {t:'Encontros e leituras juntas',itens:[
      {ic:'calendario',n:'Agenda',d:'Encontros e confirmação de presença',u:'/online/agenda/'},
      {ic:'ampulheta',n:'Sprint de leitura',d:'Ler junto com o cronômetro e o ranking',u:'/online/sprint/'},
      {ic:'lanterna',n:'Ideias de encontros',d:'Sugira oficinas e encontros extras',u:'/online/ideias/'}]},
    {t:'LC Especial de Natal',itens:[
      {ic:'chama',n:'Salão Principal de Hogwarts',d:'LC Especial de Natal — Harry Potter e a Pedra Filosofal. Um espaço exclusivo para nossas missões, sprints e atividades de leitura.',u:'/online/hogwarts/',hg:1}]},
    {t:'Jogos',itens:[
      {ic:'cartela',n:'Bingo',d:'Sua cartela e os desafios',u:'/online/bingo/'},
      {ic:'coroa',n:'Arcadiana do Ano',d:'Ranking de pontos do ano',u:'/online/arcadiana/'}]},
    {t:'Divulgação',itens:[
      {ic:'brilho',n:'Sugestões para as redes',d:'Mande ideias para o Instagram',u:'/online/redes/'},
      {ic:'moldura',n:'Artes do clube',d:'Baixar artes e montar stories',u:'/online/artes/'}]},
    {t:'Ajuda',itens:[
      {ic:'balao',n:'Fale com a administração',d:'Elogio, reclamação ou problema, com ou sem nome',u:'/online/mensagem/'},
      {ic:'bussola',n:'Guia do site',d:'Passo a passo de cada página',u:'/online/guia/'}]}
  ];
  let limpezaAberta=false;
  /* Salão Principal de Hogwarts: botão sempre visível (a entrada continua protegida pela senha do Salão e o código pessoal) */
  function desenhar(){
    $('grupos').innerHTML=GRUPOS.map(g=>{const its=g.itens.filter(i=>(!i.limpeza||limpezaAberta));if(!its.length)return'';
      return '<section class="panel grupo"><p class="lbl">'+esc(g.t)+'</p><ul class="atalhos">'+its.map(i=>
        '<li><a href="'+esc(i.u)+'"><span class="ic" aria-hidden="true">'+ARC_ICONE(i.ic)+'</span><span class="tx"><b>'+esc(i.n)+'</b><small>'+esc(i.d)+'</small></span>'+
        (i.limpeza?'<span class="novo">Aberta</span>':'')+'<span class="seta" aria-hidden="true">›</span></a></li>').join('')+'</ul></section>'}).join('')}

  const load=src=>new Promise((ok,no)=>{const sc=document.createElement('script');sc.src=src;sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
  let db,uid;
  try{
    const FB='10.12.2';
    await load(`https://www.gstatic.com/firebasejs/${FB}/firebase-app-compat.js`);
    await load(`https://www.gstatic.com/firebasejs/${FB}/firebase-auth-compat.js`);
    await load(`https://www.gstatic.com/firebasejs/${FB}/firebase-firestore-compat.js`);
    if(!firebase.apps.length)firebase.initializeApp(window.ARCADIA_FIREBASE);
    const auth=firebase.auth();
    let u=await new Promise(ok=>{const off=auth.onAuthStateChanged(x=>{off();ok(x)})});
    if(!u)u=(await auth.signInAnonymously()).user;
    uid=u.uid;db=firebase.firestore();
  }catch(e){console.warn(e);$('estado').textContent='Sem conexão agora. Verifique a internet e recarregue a página.';return}

  /* senha do clube (a mesma do sprint) */
  if(LS.get('membroOk','')!==uid){
    let ok=false;try{ok=(await db.collection('membros').doc(uid).get()).exists}catch(e){}if(!ok){try{const k=JSON.parse(localStorage.getItem('arcadiaOnline:chave')||'""');if(k){await db.collection('membros').doc(uid).set({chave:k,em:Date.now()});ok=true}}catch(e){}}
    if(!ok){$('estado').textContent='Digite a senha do clube para ver as páginas.';
      await new Promise(done=>{$('gate').hidden=false;setTimeout(()=>$('gateInput').focus(),80);
      $('gateForm').onsubmit=async ev=>{ev.preventDefault();const chave=$('gateInput').value.trim().toLowerCase();if(!chave)return;
        $('gateBtn').disabled=true;$('gateErr').hidden=true;
        try{await db.collection('membros').doc(uid).set({chave,em:Date.now()});try{localStorage.setItem('arcadiaOnline:chave',JSON.stringify(chave))}catch(e){}$('gate').hidden=true;done()}
        catch(e){$('gateErr').textContent='Senha incorreta. Confira com a administração do clube.';$('gateErr').hidden=false}
        $('gateBtn').disabled=false}})}
    LS.set('membroOk',uid)}
  LS.set('integrante',1);
  $('estado').textContent='Escolha para onde quer ir.';
  desenhar();$('grupos').hidden=false;
  if(window.ARC_INSTALAR)ARC_INSTALAR($('grupos'));
  /* a limpeza da lista só aparece enquanto estiver aberta */
  db.collection('limpezas').onSnapshot(s=>{const agora=Date.now();
    limpezaAberta=s.docs.some(d=>{const x=d.data();return !x.encerrada&&x.fechaEm&&x.fechaEm.toMillis()>=agora});desenhar()},e=>console.warn(e));
})();
</script>
</body>
</html>
