<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Online · Administração · Cartas Seladas</title>
<meta name="theme-color" content="#170f33">
<link rel="icon" type="image/png" href="/selo-arcadia.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Lora:ital,wght@0,400;0,500;0,600;1,500&family=Nunito+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/fx.css">
<link rel="stylesheet" href="/online/leitura/leitura.css">
<link rel="stylesheet" href="/online/livros/livros.css">
<link rel="stylesheet" href="../cartas.css">
</head>
<body>
<div class="scene" id="scene" aria-hidden="true" style="background-image:none"><div class="art" id="art"></div></div>
<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="petals" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<main class="wrap">
  <p class="turma-adm" style="align-self:center;width:max-content;max-width:100%;margin:0 auto 4px;padding:5px 14px;border:1px solid rgba(214,180,108,.55);border-radius:999px;font:700 12px/1.3 'Nunito Sans',system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#e7c987;background:rgba(23,15,51,.6)">Administração online</p>
  <div class="row" style="justify-content:space-between"><a class="back" href="../">← Cartas Seladas</a><a class="back" href="/online/admin/">Painel da administração</a></div>
  <section class="panel arch">
    <div class="top">
      <img class="seal" src="/selo-arcadia.png" alt="" width="72" height="72">
      <p class="lbl">Cartas Seladas</p>
      <h1>Administração</h1>
    </div>
    <div id="state" style="margin-top:14px;text-align:center"><p class="muted">Carregando…</p></div>
  </section>
  <div id="area" hidden style="display:flex;flex-direction:column;gap:16px">
    <section class="panel" id="cfgP"><p class="muted" style="margin:0">Carregando…</p></section>
    <section class="panel" id="quemP" hidden>
      <p class="lbl">Integrantes</p>
      <h2>Quem já lacrou</h2>
      <p class="muted small" style="margin:-6px 0 10px">Antes da abertura, ninguém consegue ler as cartas, nem a administração. Aqui aparecem só os nomes.</p>
      <div id="quem"></div>
    </section>
    <section class="panel" id="cartasP" hidden>
      <p class="lbl">Cartas</p>
      <h2>Cartas abertas</h2>
      <div id="cartas"></div>
    </section>
    <div class="row" style="justify-content:center"><button class="btn ghost" type="button" id="sair">Sair da conta</button></div>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>
<script>window.ARC_SET={largo:'banner',alto:'frame'}</script>
<script src="/fx.js"></script>
<script src="/online/config.js"></script>
<script src="/online/sprint/config.js"></script>
<script src="/online/livros/comum.js"></script>
<script src="../comum.js"></script>
<script>
(async function(){
  const $=id=>document.getElementById(id),st=$('state');
  const L=window.LIVROS,{esc,slug}=L,C=window.CARTAS;
  const CFG=window.ARCADIA_CONFIG||{};
  const MEMBROS=(CFG.membros||[]).map(String);
  let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2800)}
  const copiar=async(t,ok)=>{try{await navigator.clipboard.writeText(t);toast(ok)}catch(e){prompt('Copie o texto:',t)}};
  const load=src=>new Promise((ok,no)=>{const sc=document.createElement('script');sc.src=src;sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
  const V='10.12.2';
  try{await load(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);await load(`https://www.gstatic.com/firebasejs/${V}/firebase-auth-compat.js`);await load(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore-compat.js`)}
  catch(e){st.innerHTML='<p class="muted">Sem conexão agora. Recarregue a página.</p>';return}
  // app separado: o login de administração não mexe no acesso de integrante deste aparelho
  const app=firebase.initializeApp(window.ARCADIA_FIREBASE||CFG.firebase,'admin');const auth=app.auth(),db=app.firestore();
  const FV=firebase.firestore.FieldValue,TS=firebase.firestore.Timestamp;
  try{await auth.getRedirectResult()}catch(e){console.warn(e)}

  function login(){$('area').hidden=true;
    st.innerHTML='<p>Esta parte é só para a administração do clube.</p><button class="btn" id="g">Entrar com Google</button>';
    $('g').onclick=async()=>{const p=new firebase.auth.GoogleAuthProvider();try{await auth.signInWithPopup(p)}
      catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')auth.signInWithRedirect(p);
        else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')st.insertAdjacentHTML('beforeend','<p class="muted small">Não foi possível entrar: '+esc(e.code)+'</p>')}}}
  $('sair').onclick=()=>auth.signOut();

  let iniciou=false;
  auth.onAuthStateChanged(async u=>{
    if(!u||u.isAnonymous)return login();
    let admin=false;try{admin=(await db.collection('admins').doc(u.uid).get()).exists}catch(e){}
    // conselho: e-mail Google na lista do conselho (a Bia mantém em /online/admin)
    if(!admin&&u.email){try{admin=(await db.collection('conselho').doc(u.email.toLowerCase()).get()).exists}catch(e){}}
    if(!admin){$('area').hidden=true;st.innerHTML='<p>Você entrou como <b>'+esc(u.email)+'</b>, mas esta conta ainda não tem acesso.</p><p class="muted small">Se você faz parte do conselho, peça para a Bia incluir este e-mail na lista do conselho.</p><button class="btn ghost" id="out">Sair</button>';$('out').onclick=()=>auth.signOut();return}
    st.innerHTML='<p class="muted small" style="margin:0">Conectada como '+esc(u.email)+'</p>';$('area').hidden=false;
    if(!iniciou){iniciou=true;iniciar()}
  });

  function iniciar(){
    const col=db.collection('cartasSeladas');
    let tentativas=0,rodadas=null,sel=null,selos=[],cartas=[],offS=null,offC=null,livro='',encontro=null;
    col.onSnapshot(s=>{rodadas=s.docs.map(d=>Object.assign({_id:d.id},d.data()));
      const ant=sel&&rodadas.find(x=>x._id===sel._id);const n=ant||C.atual(rodadas);
      const abriu=n&&sel&&n._id===sel._id&&C.situacao(n)!==C.situacao(sel);
      if(!n||!sel||n._id!==sel._id||abriu){sel=n;ouvir()}else sel=n;cfg();quem()},e=>{console.warn(e);toast('Erro ao ler: '+e.code)});
    /* para sugerir o título e as datas: livro do mês atual e próximo encontro da agenda */
    db.collection('leituras').orderBy('inicio','desc').limit(1).get().then(s=>{if(s.docs[0])livro=s.docs[0].data().titulo||'';cfg()}).catch(e=>console.warn(e));
    db.collection('eventos').where('data','>=',L.hojeISO()).get().then(s=>{const evs=s.docs.map(d=>d.data()).filter(e=>e.tema==='livro').sort((a,b)=>a.data<b.data?-1:1);encontro=evs[0]||null;cfg()}).catch(e=>console.warn(e));
    setInterval(()=>{if(sel&&rodadas){const n=rodadas.find(x=>x._id===sel._id);if(n&&C.situacao(n)==='aberta'&&!offC){ouvir()}cfg()}},30000);
    function ouvir(){if(offS){offS();offS=null}if(offC){offC();offC=null}selos=[];cartas=[];
      if(!sel)return;
      offS=col.doc(sel._id).collection('selos').onSnapshot(s=>{selos=s.docs.map(d=>Object.assign({_id:d.id},d.data()));quem()},e=>console.warn(e));
      if(C.situacao(sel)==='aberta')offC=col.doc(sel._id).collection('cartas').onSnapshot(s=>{cartas=s.docs.map(d=>Object.assign({_id:d.id},d.data()));mostrarCartas()},e=>{console.warn(e);offC=null;/* o relógio do aparelho pode estar adiantado: tenta de novo */if(e.code==='permission-denied'&&tentativas++<1)setTimeout(()=>location.reload(),4000);else toast('Erro ao ler as cartas: '+e.code)});
      mostrarCartas()}

    const ISO=t=>{const d=new Date(C.ms(t));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
    const HORA=t=>{const d=new Date(C.ms(t));return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
    function form(x){
      const enc=encontro&&encontro.data>=L.hojeISO()?encontro:null;
      const abre=x?ISO(x.abreEm):(enc?enc.data:C.somaDias(L.hojeISO(),14));
      const hora=x?HORA(x.abreEm):(enc&&enc.hora?enc.hora:'19:00');
      const ate=x?ISO(x.ateEm):C.somaDias(abre,-1);
      return '<form class="form" id="rf">'+
        '<label>Livro<input type="text" id="fTit" maxlength="80" value="'+esc(x?x.titulo:livro)+'" required></label>'+
        '<label>Pergunta ou orientação <small>opcional. Ex.: Quem você acha que é o traidor? Como termina?</small><textarea id="fOri" maxlength="300" rows="2">'+esc(x?x.orient||'':'')+'</textarea></label>'+
        '<div class="datas2"><label>Lacrar até <small>até o fim do dia</small><input type="date" id="fAte" value="'+ate+'" required></label>'+
        '<label>Abrir as cartas em <small>'+(enc&&!x?'encontro da agenda':'dia e hora')+'</small><input type="date" id="fAbre" value="'+abre+'" required></label></div>'+
        '<label style="max-width:220px">Horário da abertura<input type="time" id="fHora" value="'+hora+'" required></label>'+
        '<p class="muted small" style="margin:0">As integrantes escrevem até o fim do dia escolhido. As cartas abrem sozinhas no dia e na hora da abertura. Você também pode abrir na hora, durante o encontro.</p>'+
        '<button class="btn" type="submit" id="rfB">'+(x?'Salvar':'Abrir as Cartas Seladas')+'</button></form>'}
    function ligarForm(x){$('rf').addEventListener('input',()=>{$('cfgP').dataset.editando='1'});
      $('rf').onsubmit=async e=>{e.preventDefault();
      const titulo=$('fTit').value.trim(),orient=$('fOri').value.trim(),ate=$('fAte').value,abre=$('fAbre').value,hora=$('fHora').value||'00:00';
      if(!titulo){toast('Escreva o livro');return}
      if(!ate||!abre){toast('Escolha as datas');return}
      const ateEm=C.fimDia(ate),abreEm=C.noHorario(abre,hora);
      if(abreEm<=ateEm){toast('A abertura precisa ser depois do último dia para lacrar');return}
      if(!x&&ateEm<Date.now()){toast('O último dia para lacrar já passou');return}
      const d={titulo,orient,ate,abre,hora,ateEm:TS.fromDate(ateEm),abreEm:TS.fromDate(abreEm)};
      $('rfB').disabled=true;
      try{if(x){await col.doc(x._id).update(d);toast('Salvo')}
        else{d.criadoEm=FV.serverTimestamp();const ref=await col.add(d);sel=Object.assign({_id:ref.id},d);ouvir();toast('Cartas Seladas abertas ✨')}
        $('cfgP').dataset.editando='';cfg();quem()}
      catch(er){console.warn(er);toast('Não foi possível salvar: '+er.code);$('rfB').disabled=false}}}

    function cfg(){const el=$('cfgP');if(!rodadas)return;
      if(el.querySelector('#rf')&&el.dataset.editando)return;
      const todas=rodadas.slice().sort((a,b)=>C.ms(b.abreEm)-C.ms(a.abreEm));
      const seletor=todas.length>1?'<label style="margin-top:14px">Ver outra rodada<select id="outra">'+todas.map(x=>'<option value="'+esc(x._id)+'"'+(sel&&x._id===sel._id?' selected':'')+'>'+esc(x.titulo||'Livro')+' · '+esc(C.curto(x.abreEm))+'</option>').join('')+'</select></label>':'';
      if(!sel){el.innerHTML='<p class="lbl">Cartas Seladas</p><h2>Abrir uma rodada</h2>'+form(null);el.dataset.editando='';ligarForm(null);return}
      const s=C.situacao(sel);
      const nome={escrita:'Recebendo cartas',lacrada:'Lacradas, esperando a abertura',aberta:'Cartas abertas'}[s];
      el.innerHTML='<p class="lbl">'+esc(sel.titulo||'Cartas Seladas')+'</p><h2>'+nome+'</h2>'+
        '<p style="margin:0 0 8px"><span class="st '+s+'">'+(s==='escrita'?'Lacrar até '+esc(C.curto(sel.ateEm)):s==='lacrada'?'Abre '+esc(C.quando(sel.abreEm)):'Abertas')+'</span></p>'+
        (sel.orient?'<p class="orient">'+esc(sel.orient)+'</p>':'')+
        '<p class="muted small" style="margin:0 0 12px">Lacrar até o fim de <b style="color:var(--cream)">'+esc(C.quando(sel.ateEm).replace(/ às.*$/,''))+'</b>. Abertura: <b style="color:var(--cream)">'+esc(C.quando(sel.abreEm))+'</b>. Link: <b style="color:var(--cream)">sociedadearcadia.com.br/online/cartas</b></p>'+
        '<div class="acoes">'+(s!=='aberta'?'<button class="btn" type="button" data-a="convite">Copiar convite</button><button class="btn" type="button" data-a="abrir">Abrir as cartas agora</button><button class="btn ghost" type="button" data-a="mudar">Mudar datas ou texto</button>':'<button class="btn ghost" type="button" data-a="nova">Nova rodada</button>')+
        '<button class="btn no" type="button" data-a="apagar">Apagar esta rodada</button></div><div id="mudarBox"></div>'+seletor;
      const o=$('outra');if(o)o.onchange=()=>{sel=rodadas.find(x=>x._id===o.value)||sel;ouvir();cfg();quem()};
      el.querySelector('.acoes').onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
        if(a==='convite')return copiar('Meninas, as Cartas Seladas de '+sel.titulo+' estão abertas! ✉️\n\n'+(sel.orient?sel.orient+'\n\n':'')+'Escreva sua teoria ou previsão antes de terminar o livro e lacre a carta. Ninguém lê antes da abertura, nem a administração.\n\nPode lacrar até '+C.quando(sel.ateEm).replace(/ às.*$/,'')+'. As cartas abrem '+C.quando(sel.abreEm).toLowerCase()+'.\n\nsociedadearcadia.com.br/online/cartas','Convite copiado');
        if(a==='mudar'){$('mudarBox').innerHTML='<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:14px">'+form(sel)+'</div>';el.dataset.editando='1';ligarForm(sel);
          $('rf').insertAdjacentHTML('beforeend','<button class="btn ghost" type="button" id="cancelar">Cancelar</button>');$('cancelar').onclick=()=>{el.dataset.editando='';cfg()};return}
        if(a==='nova'){el.dataset.editando='';sel=null;ouvir();cfg();quem();return}
        if(a==='abrir'){if(!confirm('Abrir as cartas agora? Todas passam a ver todas as cartas e ninguém mais consegue lacrar.'))return;
          b.disabled=true;
          try{const agora=TS.now();const upd={abreEm:FV.serverTimestamp(),abre:ISO(agora),hora:HORA(agora)};if(C.ms(sel.ateEm)>Date.now()){upd.ateEm=FV.serverTimestamp();upd.ate=ISO(agora)}
            await col.doc(sel._id).update(upd);toast('Cartas abertas ✨');/* recarrega para ler as cartas com a abertura já valendo */setTimeout(()=>location.reload(),1500)}catch(er){console.warn(er);toast('Não foi possível: '+er.code);b.disabled=false}return}
        if(a==='apagar'){if(!confirm('Apagar esta rodada e todas as cartas dela? Não dá para desfazer.'))return;
          b.disabled=true;
          try{const s2=await col.doc(sel._id).collection('selos').get();const bt=db.batch();
            s2.docs.forEach(d=>{bt.delete(d.ref);bt.delete(col.doc(sel._id).collection('cartas').doc(d.id))});
            bt.delete(col.doc(sel._id));await bt.commit();sel=null;toast('Rodada apagada')}
          catch(er){console.warn(er);toast('Não foi possível: '+er.code);b.disabled=false}}};
      el.dataset.editando=''}

    function quem(){const p=$('quemP');if(!sel){p.hidden=true;return}p.hidden=false;
      const tem=new Set(selos.map(s=>s._id));
      const falta=MEMBROS.filter(n=>!tem.has(slug(n)));
      $('quem').innerHTML='<p class="muted small" style="margin:0">'+selos.length+' de '+MEMBROS.length+' lacraram</p>'+
        (selos.length?'<ul class="selos">'+selos.slice().sort((a,b)=>String(a.nome).localeCompare(String(b.nome))).map(s=>'<li><img src="/selo-arcadia.png" alt="">'+esc(s.nome)+'<button class="x" type="button" data-n="'+esc(s._id)+'" title="Apagar a carta de '+esc(s.nome)+'" aria-label="Apagar a carta de '+esc(s.nome)+'">×</button></li>').join('')+'</ul>':'')+
        (falta.length?'<p class="lbl" style="margin-top:14px">Ainda não lacraram</p><ul class="selos falta">'+falta.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul>':'');
      $('quem').onclick=async e=>{const b=e.target.closest('.x');if(!b)return;const s=selos.find(x=>x._id===b.dataset.n);
        if(!confirm('Apagar a carta de '+(s?s.nome:'')+'? Ela vai poder escrever de novo enquanto o prazo estiver aberto.'))return;
        try{const bt=db.batch();bt.delete(col.doc(sel._id).collection('cartas').doc(b.dataset.n));bt.delete(col.doc(sel._id).collection('selos').doc(b.dataset.n));await bt.commit();toast('Carta apagada')}
        catch(er){console.warn(er);toast('Não foi possível: '+er.code)}}}
    function mostrarCartas(){const p=$('cartasP');if(!sel||C.situacao(sel)!=='aberta'){p.hidden=true;return}p.hidden=false;
      $('cartas').innerHTML=cartas.length?'<ul class="envelopes">'+cartas.slice().sort((a,b)=>String(a.nome).localeCompare(String(b.nome))).map(c=>'<li class="env aberta"><button type="button" tabindex="-1"><span class="lacre"><img src="/selo-arcadia.png" alt=""></span><span class="nm"><b>'+esc(c.nome)+'</b></span></button><p class="txt">'+esc(c.texto)+'</p></li>').join('')+'</ul>'+
        '<div class="row" style="justify-content:center;margin-top:14px"><button class="btn ghost" type="button" id="copiarC">Copiar todas as cartas</button></div>':'<p class="muted" style="margin:0">Nenhuma carta nesta rodada.</p>';
      const b=$('copiarC');if(b)b.onclick=()=>copiar('✉️ Cartas Seladas · '+sel.titulo+'\n\n'+cartas.slice().sort((a,b)=>String(a.nome).localeCompare(String(b.nome))).map(c=>c.nome+':\n'+c.texto).join('\n\n'),'Cartas copiadas')}
  }
})();
</script>
</body>
</html>
