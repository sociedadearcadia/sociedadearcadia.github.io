<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Online · Administração · Ideias de atividades</title>
<meta name="theme-color" content="#170f33">
<link rel="icon" type="image/png" href="/selo-arcadia.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Lora:ital,wght@0,400;0,500;0,600;1,500&family=Nunito+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/fx.css">
<link rel="stylesheet" href="/online/leitura/leitura.css">
<link rel="stylesheet" href="/online/livros/livros.css">
<link rel="stylesheet" href="../ideias.css">
</head>
<body>
<div class="scene" id="scene" aria-hidden="true" style="background-image:none"><div class="art" id="art"></div></div>
<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="petals" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<main class="wrap">
  <div class="row" style="justify-content:space-between"><a class="back" href="../">← Ideias de atividades</a><a class="back" href="/online/admin/">Painel da administração</a></div>
  <section class="panel arch">
    <div class="top">
      <img class="seal" src="/selo-arcadia.png" alt="" width="72" height="72">
      <p class="lbl">Ideias de atividades</p>
      <h1>Administração</h1>
    </div>
    <div id="state" style="margin-top:14px;text-align:center"><p class="muted">Carregando…</p></div>
  </section>

  <div id="area" hidden style="display:flex;flex-direction:column;gap:16px">
    <section class="panel">
      <p class="lbl">Para olhar</p>
      <h2>Ideias aguardando<span class="badge" id="pendN" hidden></span></h2>
      <ul class="ideias" id="pend"><li class="muted small">Carregando…</li></ul>
    </section>
    <section class="panel">
      <p class="lbl">Aprovadas</p>
      <h2 id="aprT">Ideias aprovadas</h2>
      <ul class="ideias" id="apr"></ul>
    </section>
    <section class="panel">
      <p class="lbl">Histórico</p>
      <h2>Ideias não aprovadas</h2>
      <ul class="ideias" id="rec"></ul>
    </section>
    <div class="row" style="justify-content:center"><button class="btn ghost" type="button" id="sair">Sair da conta</button></div>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>window.ARC_SET={largo:'banner',alto:'frame'}</script>
<script src="/fx.js"></script>
<script src="/online/config.js"></script>
<script src="/online/sprint/config.js"></script>
<script src="/online/livros/comum.js"></script>
<script src="../comum.js"></script>
<script>
(async function(){
  const $=id=>document.getElementById(id),st=$('state');
  const L=window.LIVROS,{esc}=L,I=window.IDEIAS;
  const CFG=window.ARCADIA_CONFIG||{};
  let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2800)}
  const data=ts=>ts&&ts.toDate?ts.toDate().toLocaleDateString('pt-BR'):'';

  const load=src=>new Promise((ok,no)=>{const sc=document.createElement('script');sc.src=src;sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
  const V='10.12.2';
  try{await load(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);await load(`https://www.gstatic.com/firebasejs/${V}/firebase-auth-compat.js`);await load(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore-compat.js`)}
  catch(e){st.innerHTML='<p class="muted">Sem conexão agora. Recarregue a página.</p>';return}
  // app separado: o login de administração não mexe no acesso de integrante deste aparelho
  const app=firebase.initializeApp(window.ARCADIA_FIREBASE||CFG.firebase,'admin');const auth=app.auth(),db=app.firestore();
  const FV=firebase.firestore.FieldValue;
  try{await auth.getRedirectResult()}catch(e){console.warn(e)}

  function login(){$('area').hidden=true;
    st.innerHTML='<p>Esta parte é só para a administração do clube.</p><button class="btn" id="g">Entrar com Google</button>';
    $('g').onclick=async()=>{const p=new firebase.auth.GoogleAuthProvider();try{await auth.signInWithPopup(p)}
      catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')auth.signInWithRedirect(p);
        else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')st.insertAdjacentHTML('beforeend','<p class="muted small">Não foi possível entrar: '+esc(e.code)+'</p>')}}}
  $('sair').onclick=()=>auth.signOut();

  let iniciou=false;
  auth.onAuthStateChanged(async u=>{
    if(!u||u.isAnonymous)return login();
    let admin=false;try{admin=(await db.collection('admins').doc(u.uid).get()).exists}catch(e){}
    // conselho: e-mail Google na lista do conselho (a Bia mantém em /online/admin)
    if(!admin&&u.email){try{admin=(await db.collection('conselho').doc(u.email.toLowerCase()).get()).exists}catch(e){}}
    if(!admin){$('area').hidden=true;st.innerHTML='<p>Você entrou como <b>'+esc(u.email)+'</b>, mas esta conta ainda não tem acesso.</p><p class="muted small">Se você faz parte do conselho, peça para a Bia incluir este e-mail na lista do conselho.</p><button class="btn ghost" id="out">Sair</button>';$('out').onclick=()=>auth.signOut();return}
    st.innerHTML='<p class="muted small" style="margin:0">Conectada como '+esc(u.email)+'</p>';$('area').hidden=false;
    if(!iniciou){iniciou=true;iniciar()}
  });

  function iniciar(){
    const col=db.collection('ideias');let todas=[],editando=null;
    col.onSnapshot(s=>{todas=s.docs.map(d=>Object.assign({_id:d.id},d.data()));desenhar()},
      e=>{console.warn(e);toast('Erro ao ler as ideias: '+e.code)});

    function card(x,extra){
      return '<li class="ideia '+I.cls(x.tipo)+'" data-id="'+esc(x._id)+'">'+
        '<div class="topo"><h3>'+esc(x.titulo)+'</h3>'+I.tag(x.tipo)+'</div>'+
        '<p class="por">Sugerido por <b style="color:var(--cream)">'+esc(x.nome)+'</b>'+(data(x.criadoEm)?' em '+data(x.criadoEm):'')+'</p>'+
        '<p class="sub">Explicação</p><p class="txt">'+esc(x.explicacao)+'</p>'+
        '<p class="sub">Organização proposta</p><p class="txt">'+esc(x.organizacao)+'</p>'+
        extra(x)+'</li>'}
    const campoNota=(x,rot)=>'<label style="margin-top:8px">'+rot+' <small>Opcional. Quem sugeriu vê na página.</small><textarea data-nota rows="2" maxlength="'+I.MAX.nota+'">'+esc(x.nota||'')+'</textarea></label>';

    function desenhar(){
      const pend=todas.filter(x=>x.status==='pendente').sort(I.antigas);
      const apr=todas.filter(x=>x.status==='aprovada').sort(I.recentes);
      const rec=todas.filter(x=>x.status==='recusada').sort(I.recentes);
      $('pendN').hidden=!pend.length;$('pendN').textContent=pend.length;
      $('pend').innerHTML=pend.length?pend.map(x=>card(x,x=>campoNota(x,'Recado para quem sugeriu')+
          '<div class="acoes"><button class="btn ok" type="button" data-acao="aprovar">Aprovar</button><button class="btn no" type="button" data-acao="recusar">Não aprovar</button></div>')).join('')
        :'<li class="muted small">Nenhuma ideia esperando.</li>';
      $('aprT').textContent=apr.length===1?'1 ideia aprovada':apr.length+' ideias aprovadas';
      $('apr').innerHTML=apr.length?apr.map(x=>card(x,x=>'<p class="muted small" style="margin:6px 0 0">Organização: '+esc(x.nome)+' e a administração.</p>'+
          (editando===x._id?campoNota(x,'Recado')+'<div class="acoes"><button class="btn" type="button" data-acao="salvarNota">Salvar recado</button><button class="btn ghost" type="button" data-acao="cancelar">Cancelar</button></div>'
            :(x.nota?'<p class="nota"><b>Recado:</b> '+esc(x.nota)+'</p>':'')+
             '<div class="ed"><button class="lnk" type="button" data-acao="editar">'+(x.nota?'Mudar recado':'Escrever recado')+'</button><button class="lnk" type="button" data-acao="voltar">Voltar para aguardando</button><button class="del" type="button" data-acao="apagar">Apagar</button></div>'))).join('')
        :'<li class="muted small">Nenhuma ainda.</li>';
      $('rec').innerHTML=rec.length?rec.map(x=>card(x,x=>(x.nota?'<p class="nota"><b>Recado:</b> '+esc(x.nota)+'</p>':'')+
          '<div class="ed"><button class="lnk" type="button" data-acao="aprovar">Aprovar</button><button class="lnk" type="button" data-acao="voltar">Voltar para aguardando</button><button class="del" type="button" data-acao="apagar">Apagar</button></div>')).join('')
        :'<li class="muted small">Nenhuma.</li>'}

    document.addEventListener('click',async e=>{const b=e.target.closest('[data-acao]');if(!b)return;
      const li=b.closest('[data-id]');if(!li)return;const id=li.dataset.id,x=todas.find(y=>y._id===id);if(!x)return;
      const a=b.dataset.acao,ta=li.querySelector('[data-nota]'),nota=ta?ta.value.trim():(x.nota||'');
      if(a==='editar'){editando=id;desenhar();return}
      if(a==='cancelar'){editando=null;desenhar();return}
      b.disabled=true;
      try{
        if(a==='aprovar'){await col.doc(id).update({status:'aprovada',nota});toast('“'+x.titulo+'” aprovada')}
        else if(a==='recusar'){await col.doc(id).update({status:'recusada',nota});toast('Ideia não aprovada')}
        else if(a==='voltar'){await col.doc(id).update({status:'pendente'});toast('Voltou para aguardando')}
        else if(a==='salvarNota'){await col.doc(id).update({nota});editando=null;desenhar();toast('Recado salvo')}
        else if(a==='apagar'){if(!confirm('Apagar a ideia “'+x.titulo+'”? Quem sugeriu deixa de ver.')){b.disabled=false;return}
          await col.doc(id).delete();toast('Apagada')}
      }catch(er){console.warn(er);toast('Não foi possível agora: '+er.code);b.disabled=false}});
  }
})();
</script>
</body>
</html>
