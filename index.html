<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sociedade Arcádia</title>
<meta name="description" content="Sociedade Arcádia, clube de leitura.">
<meta name="theme-color" content="#1a0b2e">
<meta property="og:title" content="Sociedade Arcádia">
<meta property="og:description" content="Clube de leitura">
<meta property="og:image" content="selo-arcadia.png">
<link rel="icon" type="image/png" href="selo-arcadia.png">
<link rel="apple-touch-icon" href="selo-arcadia.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;1,500&family=Nunito+Sans:wght@600;700&display=swap">
<style>
:root{--night:#1a0b2e;--cream:#f4e8da;--gold:#d6b46c;--lilac:#c9b6f2;--plum:#4a1f7a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night) url("fundo-arcadia-largo.webp") center/cover no-repeat fixed;color:var(--cream);font-family:"Nunito Sans",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
@media (orientation:portrait){body{background-image:url("fundo-arcadia-alto.webp")}}
main{max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;padding:32px 24px;border-radius:999px 999px 18px 18px/220px 220px 18px 18px;
  background:radial-gradient(90% 60% at 50% 30%,rgba(59,31,99,.6),rgba(26,11,46,.72));border:1px solid rgba(214,180,108,.75);box-shadow:inset 0 0 0 6px rgba(26,11,46,.45),inset 0 0 0 7px rgba(214,180,108,.35),0 24px 70px rgba(8,3,18,.6);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
img{width:132px;height:132px;border-radius:50%;box-shadow:0 0 0 1px var(--gold),0 8px 30px rgba(0,0,0,.5)}
.eyebrow{font-family:Lora,serif;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin:0}
h1{font-family:Lora,serif;font-style:italic;font-weight:500;font-size:36px;margin:0;line-height:1.15}
a.btn{display:inline-block;margin-top:8px;padding:14px 32px;border-radius:999px;background:linear-gradient(180deg,#e1d2ff,var(--lilac));color:var(--night);font-weight:700;font-size:16px;text-decoration:none;box-shadow:0 6px 24px rgba(201,182,242,.3)}
a.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="selo-arcadia.png" alt="Selo da Sociedade Arcádia">
  <p class="eyebrow">Clube de leitura</p>
  <h1>Sociedade Arcádia</h1>
  <a class="btn" href="sprint/">Sprint de leitura</a>
</main>
</body>
</html>
