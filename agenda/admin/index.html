<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Administração · Agenda</title>
<meta name="theme-color" content="#170f33">
<link rel="icon" type="image/png" href="/selo-arcadia.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Lora:ital,wght@0,400;0,500;0,600;1,500&family=Nunito+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/fx.css">
<link rel="stylesheet" href="/leitura/leitura.css">
<link rel="stylesheet" href="../agenda.css">
<style>
input[type=date],input[type=time]{font:16px var(--body);color:var(--cream);background:rgba(23,15,51,.75);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-width:0;min-height:48px;-webkit-appearance:none;appearance:none;color-scheme:dark}
textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.adm-ev{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.adm-ev:first-child{border-top:0;margin-top:0;padding-top:0}
.adm-ev .ev{cursor:default}
.adm-ev .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.adm-ev .acts .btn{padding:8px 4px;font-size:13px;white-space:nowrap}
.adm-ev .acts .apaga{color:#f2a0b8;border-color:rgba(242,160,184,.45)}
.del{font:600 12.5px var(--body);color:#f2a0b8;background:none;border:0;cursor:pointer;text-decoration:underline;padding:0}
.lst{margin:10px 0 0;font-size:13.5px;display:none}
.lst.on{display:block}
.lst p{margin:0 0 6px}
</style>
</head>
<body>
<div class="scene" id="scene" aria-hidden="true" style="background-image:none"><div class="art" id="art"></div></div>
<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="petals" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<main class="wrap">
  <p class="turma-adm" style="align-self:center;width:max-content;max-width:100%;margin:0 auto 4px;padding:5px 14px;border:1px solid rgba(214,180,108,.55);border-radius:999px;font:700 12px/1.3 'Nunito Sans',system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#e7c987;background:rgba(23,15,51,.6)">Administração presencial</p>
  <div class="row" style="justify-content:space-between"><a class="back" href="../">← Agenda do clube</a><a class="back" href="/admin/">Painel da administração</a></div>
  <section class="panel arch">
    <div class="top">
      <img class="seal" src="/selo-arcadia.png" alt="" width="72" height="72">
      <p class="lbl">Agenda do clube</p>
      <h1>Administração</h1>
    </div>
    <div id="state" style="margin-top:14px;text-align:center"><p class="muted">Carregando…</p></div>
  </section>

  <div id="area" hidden style="display:flex;flex-direction:column;gap:16px">
    <section class="panel">
      <p class="lbl" id="formL">Novo encontro</p>
      <h2 id="formT">Adicionar um encontro</h2>
      <form class="form" id="f">
        <label>Nome do encontro<input type="text" id="titulo" maxlength="80" required placeholder="Encontro de Natal"></label>
        <label>Tipo <small>Aparece em cima do nome. Ex.: Encontro oficial, Encontro extra</small>
          <input type="text" id="tipo" maxlength="40" list="tipos" placeholder="Encontro oficial">
          <datalist id="tipos"><option>Encontro oficial</option><option>Encontro extra</option><option>Encontro do livro do mês</option><option>Encontro especial</option><option>Reunião on-line</option></datalist></label>
        <label>Estilo do cartão
          <select id="tema"></select></label>
        <div class="two">
          <label>Data<input type="date" id="data" required></label>
          <label>Horário <small>Vazio = a confirmar</small><input type="time" id="hora"></label>
        </div>
        <label>Local<input type="text" id="local" maxlength="80" placeholder="Salão particular"></label>
        <label>Endereço <small>Vazio = a confirmar</small><input type="text" id="endereco" maxlength="160"></label>
        <label>Descrição <small>Opcional</small><textarea id="descricao" maxlength="600"></textarea></label>
        <div class="row">
          <button class="btn" type="submit" id="salvar">Adicionar encontro</button>
          <button class="btn ghost" type="button" id="cancelar" hidden>Cancelar</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <p class="lbl">Encontros</p>
      <h2>Próximos encontros</h2>
      <div id="futuros"><p class="muted small">Nenhum.</p></div>
    </section>

    <section class="panel" id="passadosP" hidden>
      <details><summary>Encontros que já passaram</summary><div id="passados" style="margin-top:12px"></div></details>
    </section>

    <div class="row" style="justify-content:center"><button class="btn ghost" type="button" id="sair">Sair da conta</button></div>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>window.ARC_SET={largo:'banner',alto:'frame'}</script>
<script src="/fx.js"></script>
<script src="/config.js"></script>
<script src="/sprint/config.js"></script>
<script src="../comum.js"></script>
<script>
(async function(){
  const $=id=>document.getElementById(id),st=$('state');
  const A=window.AGENDA,{esc,slug,icon}=A;
  const CFG=window.ARCADIA_CONFIG||{},MEMBROS=(CFG.membros||[]).map(String);
  let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2800)}
  $('tema').innerHTML=Object.entries(A.TEMAS).map(([k,v])=>'<option value="'+k+'">'+esc(v)+'</option>').join('');

  const load=src=>new Promise((ok,no)=>{const sc=document.createElement('script');sc.src=src;sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
  const V='10.12.2';
  try{await load(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);await load(`https://www.gstatic.com/firebasejs/${V}/firebase-auth-compat.js`);await load(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore-compat.js`)}
  catch(e){st.innerHTML='<p class="muted">Sem conexão agora. Recarregue a página.</p>';return}
  // app separado: o login de administração não mexe no acesso de integrante deste aparelho
  const app=firebase.initializeApp(window.ARCADIA_FIREBASE||CFG.firebase,'admin');const auth=app.auth(),db=app.firestore();
  const FV=firebase.firestore.FieldValue;
  try{await auth.getRedirectResult()}catch(e){console.warn(e)}

  function login(){$('area').hidden=true;
    st.innerHTML='<p>Esta parte é só para a administração do clube.</p><button class="btn" id="g">Entrar com Google</button>';
    $('g').onclick=async()=>{const p=new firebase.auth.GoogleAuthProvider();try{await auth.signInWithPopup(p)}
      catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')auth.signInWithRedirect(p);
        else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')st.insertAdjacentHTML('beforeend','<p class="muted small">Não foi possível entrar: '+esc(e.code)+'</p>')}}}
  $('sair').onclick=()=>auth.signOut();

  let iniciou=false;
  auth.onAuthStateChanged(async u=>{
    if(!u||u.isAnonymous)return login();
    let admin=false;try{admin=(await db.collection('admins').doc(u.uid).get()).exists}catch(e){}
    // conselho: e-mail Google na lista do conselho (a Bia mantém em /admin)
    if(!admin&&u.email){try{admin=(await db.collection('conselho').doc(u.email.toLowerCase()).get()).exists}catch(e){}}
    if(!admin){$('area').hidden=true;st.innerHTML='<p>Você entrou como <b>'+esc(u.email)+'</b>, mas esta conta ainda não tem acesso.</p><p class="muted small">Se você faz parte do conselho, peça para a Bia incluir este e-mail na lista do conselho.</p><button class="btn ghost" id="out">Sair</button>';$('out').onclick=()=>auth.signOut();return}
    st.innerHTML='<p class="muted small" style="margin:0">Conectada como '+esc(u.email)+'</p>';$('area').hidden=false;
    if(!iniciou){iniciou=true;iniciar()}
  });

  function iniciar(){
    let eventos=[],editando=null,semeou=false;const pres={},ouv={};
    const CAMPOS=['titulo','tipo','tema','data','hora','local','endereco','descricao'];
    /* os dois encontros de dezembro de 2026, criados na primeira vez que a agenda abrir vazia */
    const DEZEMBRO=[
      {id:'2026-12-06-csi',titulo:'Encontro de investigação (CSI)',tipo:'Encontro extra',tema:'csi',data:'2026-12-06',hora:'',local:'Salão particular',endereco:'',descricao:'Encontro extra de CSI, o nosso encontro de investigação.'},
      {id:'2026-12-12-natal',titulo:'Encontro de Natal',tipo:'Encontro oficial',tema:'natal',data:'2026-12-12',hora:'',local:'Salão particular',endereco:'',descricao:'Encontro especial de Natal, com a revelação do amigo secreto e a entrega dos presentes.'}];

    db.collection('eventos').orderBy('data').onSnapshot(async s=>{
      eventos=s.docs.map(d=>Object.assign({_id:d.id},d.data()));
      if(!eventos.length&&!semeou&&A.hojeISO()<'2026-12-13'){semeou=true;
        try{const b=db.batch();DEZEMBRO.forEach(e=>{const v=Object.assign({},e);delete v.id;v.criadoEm=FV.serverTimestamp();b.set(db.collection('eventos').doc(e.id),v)});await b.commit();toast('Encontros de dezembro adicionados')}
        catch(e){console.warn(e);toast('Não consegui criar os encontros de dezembro: '+e.code)}}
      eventos.forEach(e=>{if(!ouv[e._id])ouv[e._id]=db.collection('eventos').doc(e._id).collection('presencas').onSnapshot(p=>{pres[e._id]={};p.docs.forEach(d=>pres[e._id][d.id]=d.data());lista()},er=>console.warn(er))});
      lista()},e=>{console.warn(e);toast('Erro ao ler a agenda: '+e.code)});

    const abertos=new Set();
    function cartao(e){const p=pres[e._id]||{},hoje=A.hojeISO();
      const por=r=>MEMBROS.filter(n=>p[slug(n)]&&p[slug(n)].resp===r);
      const fora=Object.values(p).filter(x=>!MEMBROS.some(n=>slug(n)===slug(x.nome))).map(x=>x.nome);
      const vou=por('vou'),tal=por('talvez'),nao=por('nao'),nr=MEMBROS.filter(n=>!p[slug(n)]);
      return '<div class="adm-ev"><div class="ev t-'+esc(e.tema||'especial')+(e.data<hoje?' past':'')+'"><span class="dt"><b>'+A.dia(e.data).getDate()+'</b><span>'+A.dia(e.data).toLocaleDateString('pt-BR',{month:'short'}).replace('.','')+'</span></span>'+
        '<span class="bd"><span class="tp">'+esc(e.tipo||'Encontro')+'</span><h3>'+esc(e.titulo)+'</h3><span class="mt">'+esc([e.hora?A.hora(e.hora):'Horário a confirmar',e.local||'Local a confirmar',e.endereco||'Endereço a confirmar'].join(' · '))+'</span>'+
        '<span class="ct"><span class="pill vou">✓ '+vou.length+' vão</span><span class="pill talvez">'+tal.length+' talvez</span><span class="pill nao">'+nao.length+' não</span><span class="pill">'+nr.length+' sem resposta</span></span></span>'+icon(e.tema)+'</div>'+
        '<div class="acts"><button class="btn ghost" type="button" data-ver="'+esc(e._id)+'">'+(abertos.has(e._id)?'Esconder':'Ver nomes')+'</button><button class="btn ghost" type="button" data-copiar="'+esc(e._id)+'">Copiar</button><button class="btn" type="button" data-editar="'+esc(e._id)+'">Editar</button><button class="btn ghost apaga" type="button" data-apagar="'+esc(e._id)+'">Apagar</button></div>'+
        '<div class="lst'+(abertos.has(e._id)?' on':'')+'" id="l-'+esc(e._id)+'">'+
          '<p><b>Vão:</b> '+(esc(vou.join(', '))||'—')+'</p><p><b>Talvez:</b> '+(esc(tal.join(', '))||'—')+'</p><p><b>Não vão:</b> '+(esc(nao.join(', '))||'—')+'</p><p class="muted"><b>Sem resposta:</b> '+(esc(nr.join(', '))||'—')+'</p>'+
          (fora.length?'<p class="muted">Outros nomes: '+esc(fora.join(', '))+'</p>':'')+
          '</div></div>'}
    function lista(){const hoje=A.hojeISO(),fut=eventos.filter(e=>e.data>=hoje),pas=eventos.filter(e=>e.data<hoje).reverse();
      $('futuros').innerHTML=fut.length?fut.map(cartao).join(''):'<p class="muted small">Nenhum encontro marcado. Use o formulário acima para adicionar.</p>';
      $('passadosP').hidden=!pas.length;$('passados').innerHTML=pas.map(cartao).join('')}

    function texto(e){const p=pres[e._id]||{},por=r=>MEMBROS.filter(n=>p[slug(n)]&&p[slug(n)].resp===r);
      const t=['📅 '+e.titulo,A.dataLonga(e.data)+' · '+(e.hora?A.hora(e.hora):'horário a confirmar'),(e.local||'')+(e.endereco?' · '+e.endereco:' · endereço a confirmar'),''];
      t.push('✅ Vão ('+por('vou').length+')');por('vou').forEach(n=>t.push(n));
      if(por('talvez').length){t.push('','🤔 Talvez ('+por('talvez').length+')');por('talvez').forEach(n=>t.push(n))}
      t.push('','Confirme sua presença em sociedadearcadia.com.br/agenda');return t.join('\n')}
    async function copiar(s){try{await navigator.clipboard.writeText(s);return true}catch(e){
      const ta=document.createElement('textarea');ta.value=s;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,s.length);
      let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();return ok}}

    document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-ver],[data-copiar],[data-editar],[data-apagar]');if(!b)return;
      const id=b.dataset.ver||b.dataset.copiar||b.dataset.editar||b.dataset.apagar,e=eventos.find(x=>x._id===id);if(!e)return;
      if(b.dataset.ver){abertos.has(id)?abertos.delete(id):abertos.add(id);lista()}
      else if(b.dataset.copiar)toast(await copiar(texto(e))?'Lista copiada. É só colar no grupo.':'Não consegui copiar.');
      else if(b.dataset.editar)modo(e);
      else if(b.dataset.apagar){if(!confirm('Apagar "'+e.titulo+'" e as respostas de presença dele?'))return;
        try{const s=await db.collection('eventos').doc(id).collection('presencas').get();const bt=db.batch();s.docs.forEach(d=>bt.delete(d.ref));bt.delete(db.collection('eventos').doc(id));await bt.commit();
          if(ouv[id]){ouv[id]();delete ouv[id]}if(editando===id)modo(null);toast('Encontro apagado')}
        catch(er){toast('Não foi possível apagar: '+er.code)}}});

    function modo(e){editando=e?e._id:null;
      $('formL').textContent=e?'Editar encontro':'Novo encontro';$('formT').textContent=e?e.titulo:'Adicionar um encontro';
      $('salvar').textContent=e?'Salvar alterações':'Adicionar encontro';$('cancelar').hidden=!e;
      if(e){CAMPOS.forEach(k=>$(k).value=e[k]||'');if(!e.tema)$('tema').value='especial';$('f').scrollIntoView({behavior:'smooth',block:'start'})}
      else{$('f').reset();$('local').value='Salão particular';$('tipo').value='Encontro oficial'}}
    $('cancelar').onclick=()=>modo(null);
    modo(null);

    $('f').onsubmit=async ev=>{ev.preventDefault();
      const v={};CAMPOS.forEach(k=>v[k]=$(k).value.trim());
      if(!v.titulo||!/^\d{4}-\d{2}-\d{2}$/.test(v.data)){toast('Preencha o nome e a data');return}
      const b=$('salvar');b.disabled=true;
      try{if(editando){await db.collection('eventos').doc(editando).update(v);toast('Encontro atualizado')}
        else{v.criadoEm=FV.serverTimestamp();await db.collection('eventos').add(v);toast('Encontro adicionado')}
        modo(null)}
      catch(e){console.warn(e);toast('Não foi possível salvar: '+e.code)}
      b.disabled=false};
  }
})();
</script>
</body>
</html>
