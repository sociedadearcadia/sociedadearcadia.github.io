<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Administração · Votação do livro do mês</title>
<meta name="theme-color" content="#170f33">
<link rel="icon" type="image/png" href="/selo-arcadia.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Lora:ital,wght@0,400;0,500;0,600;1,500&family=Nunito+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/fx.css">
<link rel="stylesheet" href="/leitura/leitura.css">
<link rel="stylesheet" href="/livros/livros.css">
<link rel="stylesheet" href="../votacao.css">
</head>
<body>
<div class="scene" id="scene" aria-hidden="true" style="background-image:none"><div class="art" id="art"></div></div>
<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="petals" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<main class="wrap">
  <div class="row" style="justify-content:space-between"><a class="back" href="../">← Votação do livro do mês</a><a class="back" href="/admin/">Painel da administração</a></div>
  <section class="panel arch">
    <div class="top">
      <img class="seal" src="/selo-arcadia.png" alt="" width="72" height="72">
      <p class="lbl">Votação do livro do mês</p>
      <h1>Administração</h1>
    </div>
    <div id="state" style="margin-top:14px;text-align:center"><p class="muted">Carregando…</p></div>
  </section>

  <div id="area" hidden style="display:flex;flex-direction:column;gap:16px">
    <div id="lista" style="display:flex;flex-direction:column;gap:16px"></div>

    <section class="panel" id="novaP">
      <p class="lbl">Nova votação</p>
      <h2 id="novaT">Criar votação</h2>
      <form class="form" id="nova">
        <div class="datas3">
          <label>Encontro <small>Dia do encontro presencial.</small><input type="date" id="nEnc" required></label>
          <label>Abre em <small>Semana do encontro.</small><input type="date" id="nAbre" required></label>
          <label>Fecha em <small>Fim do dia escolhido.</small><input type="date" id="nFecha" required></label>
        </div>
        <label>Nome da votação <small>Aparece no topo da votação.</small><input type="text" id="nTitulo" maxlength="80" required autocomplete="off"></label>
        <div class="field">Os 3 livros
          <ul class="escolhidos" id="esc"></ul>
        </div>
        <div id="sorteados" hidden><p class="muted small" style="margin:0 0 6px">Últimos livros sorteados (toque para usar):</p><div class="row" id="sortRow" style="gap:6px"></div></div>
        <div class="busca" style="margin:0">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <input type="text" id="busca" placeholder="Procurar na lista oficial (título ou autora)" autocomplete="off" aria-label="Procurar livro na lista oficial">
        </div>
        <ul class="resultados" id="res"></ul>
        <div class="row"><button class="btn" type="submit" id="nBtn">Criar votação</button><button class="btn ghost" type="button" id="nCancel" hidden>Cancelar</button></div>
      </form>
    </section>

    <div class="row" style="justify-content:center"><button class="btn ghost" type="button" id="sair">Sair da conta</button></div>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>window.ARC_SET={largo:'banner',alto:'frame'}</script>
<script src="/fx.js"></script>
<script src="/config.js"></script>
<script src="/sprint/config.js"></script>
<script src="/livros/comum.js"></script>
<script src="../comum.js"></script>
<script>
(async function(){
  const $=id=>document.getElementById(id),st=$('state');
  const L=window.LIVROS,{esc,slug}=L,V=window.VOTACAO;
  const CFG=window.ARCADIA_CONFIG||{};
  const MEMBROS=(CFG.membros||[]).map(String);
  let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2800)}
  const quando=ts=>ts&&ts.toDate?ts.toDate().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';

  const load=src=>new Promise((ok,no)=>{const sc=document.createElement('script');sc.src=src;sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
  const FBV='10.12.2';
  try{await load(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app-compat.js`);await load(`https://www.gstatic.com/firebasejs/${FBV}/firebase-auth-compat.js`);await load(`https://www.gstatic.com/firebasejs/${FBV}/firebase-firestore-compat.js`)}
  catch(e){st.innerHTML='<p class="muted">Sem conexão agora. Recarregue a página.</p>';return}
  // app separado: o login de administração não mexe no acesso de integrante deste aparelho
  const app=firebase.initializeApp(window.ARCADIA_FIREBASE||CFG.firebase,'admin');const auth=app.auth(),db=app.firestore();
  const FV=firebase.firestore.FieldValue,TS=firebase.firestore.Timestamp;
  try{await auth.getRedirectResult()}catch(e){console.warn(e)}

  function login(){$('area').hidden=true;
    st.innerHTML='<p>Esta parte é só para a administração do clube.</p><button class="btn" id="g">Entrar com Google</button>';
    $('g').onclick=async()=>{const p=new firebase.auth.GoogleAuthProvider();try{await auth.signInWithPopup(p)}
      catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')auth.signInWithRedirect(p);
        else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')st.insertAdjacentHTML('beforeend','<p class="muted small">Não foi possível entrar: '+esc(e.code)+'</p>')}}}
  $('sair').onclick=()=>auth.signOut();

  let iniciou=false;
  auth.onAuthStateChanged(async u=>{
    if(!u||u.isAnonymous)return login();
    let admin=false;try{admin=(await db.collection('admins').doc(u.uid).get()).exists}catch(e){}
    if(!admin){$('area').hidden=true;st.innerHTML='<p>Você entrou como <b>'+esc(u.email)+'</b>, mas esta conta ainda não tem acesso.</p><p class="muted small">Para liberar, no console do Firebase crie em Firestore, na coleção <code>admins</code>, um documento cujo ID é:</p><p><code style="word-break:break-all">'+esc(u.uid)+'</code></p><button class="btn ghost" id="out">Sair</button>';$('out').onclick=()=>auth.signOut();return}
    st.innerHTML='<p class="muted small" style="margin:0">Conectada como '+esc(u.email)+'</p>';$('area').hidden=false;
    if(!iniciou){iniciou=true;iniciar()}
  });

  function iniciar(){
    const col=db.collection('votacoes');
    let vts=[],votos={},pres={},offs={},livros=[],sorteados=[],escolhidos=[],editando=null,abertas={};

    /* ---------- votações ---------- */
    col.onSnapshot(s=>{vts=s.docs.map(d=>Object.assign({_id:d.id},d.data())).sort((a,b)=>V.ms(b.abreEm)-V.ms(a.abreEm));
      vts.forEach(v=>{if(offs[v._id])return;
        offs[v._id]=[col.doc(v._id).collection('votos').onSnapshot(q=>{votos[v._id]=q.docs.map(d=>Object.assign({_id:d.id},d.data()));desenhar()},e=>console.warn(e)),
          col.doc(v._id).collection('privado').doc('presencial').onSnapshot(q=>{pres[v._id]=(q.exists&&q.data().n)||[];desenhar()},e=>console.warn(e))]});
      desenhar()},e=>{console.warn(e);toast('Erro ao ler as votações: '+e.code)});

    const rotulo={antes:'Ainda não abriu',aberta:'Aberta agora',encerrada:'Encerrada'};
    function cartao(v,i){
      const sit=V.situacao(v),vs=votos[v._id]||[],pr=pres[v._id]||[],ops=v.opcoes||[];
      const tot=ops.map((o,k)=>vs.filter(x=>x.opcao===k).length+(+pr[k]||0));
      const max=Math.max(0,...tot),soma=tot.reduce((a,b)=>a+b,0);
      const ja=new Set(vs.map(x=>slug(x.nome)));
      const faltam=MEMBROS.filter(n=>!ja.has(slug(n)));
      const fechada=i>0&&!abertas[v._id];
      let h='<section class="panel vt" data-id="'+esc(v._id)+'">'+
        '<div class="row" style="justify-content:space-between"><p class="lbl">'+(i===0?'Votação mais recente':'Votação anterior')+'</p><span class="st '+sit+'">'+rotulo[sit]+'</span></div>'+
        '<h2 style="margin:0">'+esc(v.titulo||'Livro do mês')+'</h2>'+
        '<p class="periodo">Aberta de <b>'+esc(V.dataCurta(v.abre))+'</b> até o fim de <b>'+esc(V.dataCurta(v.fecha))+'</b>. Encontro: <b>'+esc(V.dataLonga(v.encontro))+'</b>.</p>';
      if(fechada)return h+'<button class="lnk" type="button" data-acao="abrir" style="align-self:flex-start">Ver contagem e quem votou</button></section>';
      h+='<div><p class="lbl" style="margin-bottom:8px">Contagem</p><ul class="contagem">'+ops.map((o,k)=>'<li class="g-'+L.genero(o.genero)+(soma&&tot[k]===max?' lider':'')+'">'+
          '<span class="t">'+esc(o.titulo)+(o.autor?'<small>'+esc(o.autor)+'</small>':'')+'</span>'+
          '<span class="n">'+tot[k]+'<small>'+(tot[k]===1?'voto':'votos')+'</small></span>'+
          '<div class="bar"><i style="width:'+(soma?Math.round(tot[k]/soma*100):0)+'%"></i></div>'+
          '<label class="presencial">Online: '+vs.filter(x=>x.opcao===k).length+' · Presenciais <input type="number" min="0" max="99" inputmode="numeric" data-pres="'+k+'" value="'+(+pr[k]||'')+'" placeholder="0" aria-label="Votos presenciais para '+esc(o.titulo)+'"></label>'+
        '</li>').join('')+'</ul>'+
        '<p class="muted small" style="margin:10px 0 0">Total: '+soma+(soma===1?' voto':' votos')+' ('+vs.length+' online). Os votos presenciais que você digitar aqui somam na contagem e ficam salvos só para a administração.</p></div>'+
        '<div><p class="lbl">Já votaram online ('+vs.length+')</p>'+(vs.length?'<ul class="nomes">'+vs.slice().sort((a,b)=>String(a.nome).localeCompare(b.nome,'pt-BR')).map(x=>'<li>'+esc(x.nome)+' <small>'+quando(x.em)+'</small><button class="x" type="button" data-acao="tirarVoto" data-voto="'+esc(x._id)+'" aria-label="Apagar o voto de '+esc(x.nome)+'">×</button></li>').join('')+'</ul>':'<p class="muted small" style="margin:6px 0 0">Ninguém ainda.</p>')+'</div>'+
        '<div><p class="lbl">Ainda não votaram ('+faltam.length+')</p>'+(faltam.length?'<ul class="nomes falta">'+faltam.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul>':'<p class="muted small" style="margin:6px 0 0">Todas votaram.</p>')+'</div>'+
        '<div class="acoes" style="margin-top:0"><button class="btn" type="button" data-acao="copiar">Copiar resumo</button><button class="btn ghost" type="button" data-acao="editar">Mudar datas'+(vs.length?'':' ou livros')+'</button></div>'+
        '<div class="ed" style="display:flex;gap:16px;flex-wrap:wrap">'+(sit!=='encerrada'?'<button class="lnk" type="button" data-acao="encerrar">Encerrar agora</button>':'')+'<button class="del" type="button" data-acao="apagar">Apagar votação</button></div>';
      return h+'</section>'}
    /* não redesenha enquanto a administração digita os votos presenciais */
    let adiado=false;
    document.addEventListener('focusout',e=>{if(e.target.closest&&e.target.closest('[data-pres]')&&adiado){adiado=false;setTimeout(desenhar,1200)}});
    function desenhar(){
      const at=document.activeElement;if(at&&at.closest&&at.closest('[data-pres]')){adiado=true;return}
      $('lista').innerHTML=vts.length?vts.map(cartao).join('')
        :'<section class="panel"><p class="lbl">Votações</p><h2>Nenhuma votação ainda</h2><p class="muted" style="margin:0">Crie a primeira logo abaixo. Ela abre e fecha sozinha nas datas escolhidas.</p></section>'}
    setInterval(desenhar,60000);

    function resumo(v){
      const vs=votos[v._id]||[],pr=pres[v._id]||[],ops=v.opcoes||[];
      const ja=new Set(vs.map(x=>slug(x.nome)));
      return ['Votação: '+(v.titulo||'Livro do mês'),'',
        ...ops.map((o,k)=>{const on=vs.filter(x=>x.opcao===k).length,p=+pr[k]||0;return '• '+o.titulo+(o.autor?' ('+o.autor+')':'')+': '+(on+p)+' (online '+on+', presencial '+p+')'}),
        '','Votaram online ('+vs.length+'): '+(vs.map(x=>x.nome).sort((a,b)=>a.localeCompare(b,'pt-BR')).join(', ')||'ninguém'),
        'Não votaram online: '+(MEMBROS.filter(n=>!ja.has(slug(n))).join(', ')||'ninguém')].join('\n')}

    let tp={};
    document.addEventListener('input',e=>{const inp=e.target.closest('[data-pres]');if(!inp)return;
      const id=inp.closest('[data-id]').dataset.id;clearTimeout(tp[id]);
      tp[id]=setTimeout(async()=>{const n=[0,1,2].map(k=>{const x=document.querySelector('[data-id="'+id+'"] [data-pres="'+k+'"]');return Math.max(0,Math.min(99,parseInt(x&&x.value,10)||0))});
        try{await col.doc(id).collection('privado').doc('presencial').set({n});toast('Votos presenciais salvos')}catch(er){toast('Não foi possível salvar: '+er.code)}},900)});

    document.addEventListener('click',async e=>{const b=e.target.closest('[data-acao]');if(!b)return;
      const sec=b.closest('[data-id]');if(!sec)return;const id=sec.dataset.id,v=vts.find(x=>x._id===id);if(!v)return;
      const a=b.dataset.acao;
      if(a==='abrir'){abertas[id]=true;desenhar();return}
      if(a==='copiar'){const t=resumo(v);try{await navigator.clipboard.writeText(t);toast('Resumo copiado')}catch(er){prompt('Copie o resumo:',t)}return}
      if(a==='editar'){editarForm(v);return}
      b.disabled=true;
      try{
        if(a==='encerrar'){if(!confirm('Encerrar a votação agora? Ninguém mais consegue votar.')){b.disabled=false;return}
          await col.doc(id).update({fecha:L.hojeISO(),fechaEm:TS.fromMillis(Math.max(V.ms(v.abreEm)+1000,Date.now()-1000))});toast('Votação encerrada')}
        else if(a==='tirarVoto'){const x=(votos[id]||[]).find(y=>y._id===b.dataset.voto);if(!x)return;
          if(!confirm('Apagar o voto de '+x.nome+'? Ela poderá votar de novo enquanto a votação estiver aberta.')){b.disabled=false;return}
          await col.doc(id).collection('votos').doc(x._id).delete();toast('Voto apagado')}
        else if(a==='apagar'){const n=(votos[id]||[]).length;
          if(!confirm('Apagar a votação “'+(v.titulo||'')+'”'+(n?' e os '+n+' votos dela':'')+'? Não dá para desfazer.')){b.disabled=false;return}
          const bt=db.batch();(votos[id]||[]).forEach(x=>bt.delete(col.doc(id).collection('votos').doc(x._id)));
          bt.delete(col.doc(id).collection('privado').doc('presencial'));bt.delete(col.doc(id));await bt.commit();
          (offs[id]||[]).forEach(f=>f());delete offs[id];toast('Votação apagada')}
      }catch(er){console.warn(er);toast('Não foi possível agora: '+er.code);b.disabled=false}});

    /* ---------- livros da lista oficial ---------- */
    db.collection('sugestoes').where('status','==','lista').onSnapshot(s=>{
      livros=s.docs.map(d=>Object.assign({_id:d.id},d.data())).filter(l=>!l.lista||l.lista==='oficial').sort(L.ordem);buscar()},
      e=>{console.warn(e);$('res').innerHTML='<li class="muted small">Não foi possível ler a lista de livros.</li>'});
    db.collection('sorteios').orderBy('em','desc').limit(12).onSnapshot(s=>{
      const vistos=new Set();sorteados=[];
      s.docs.map(d=>d.data()).filter(r=>r.livro).forEach(r=>{const k=L.chave(r.livro);if(vistos.has(k))return;vistos.add(k);sorteados.push({titulo:r.livro,autor:r.autor||'',genero:r.genero||''})});
      sorteados=sorteados.slice(0,6);pintarSorteados()},e=>console.warn(e));

    function pintarSorteados(){
      $('sorteados').hidden=!sorteados.length;
      $('sortRow').innerHTML=sorteados.map((o,i)=>'<button class="chip" type="button" data-sort="'+i+'">'+esc(o.titulo)+'</button>').join('')}
    $('sortRow').onclick=e=>{const b=e.target.closest('[data-sort]');if(b)add(sorteados[+b.dataset.sort])};

    const tem=o=>escolhidos.some(x=>L.chave(x.titulo)===L.chave(o.titulo));
    function add(o){if(!o)return;if(tem(o)){toast('Esse livro já está entre os 3');return}
      if(escolhidos.length>=3){toast('Já tem 3 livros. Tire um para trocar.');return}
      escolhidos.push({titulo:String(o.titulo).slice(0,120),autor:String(o.autor||'').slice(0,120),genero:L.GEN[o.genero]?o.genero:''});pintar();buscar()}
    function pintar(){
      $('esc').innerHTML=[0,1,2].map(i=>{const o=escolhidos[i];return o?'<li class="g-'+L.genero(o.genero)+'"><div class="bd"><b>'+(i+1)+'. '+esc(o.titulo)+'</b><small>'+esc(o.autor||'')+'</small></div><button class="del" type="button" data-tira="'+i+'">Tirar</button></li>'
        :'<li class="vaga">Livro '+(i+1)+': escolha na lista abaixo</li>'}).join('')}
    $('esc').onclick=e=>{const b=e.target.closest('[data-tira]');if(!b)return;escolhidos.splice(+b.dataset.tira,1);pintar();buscar()};
    function buscar(){
      const q=slug($('busca').value).replace(/-/g,' ');
      const r=livros.filter(l=>!q||slug(l.titulo+' '+(l.autor||'')).replace(/-/g,' ').includes(q)).slice(0,q?40:8);
      $('res').innerHTML=(q?'':'<li class="muted small">Digite para procurar entre os '+livros.length+' livros da lista oficial.</li>')+
        r.map(l=>'<li><button type="button" data-livro="'+esc(l._id)+'"'+(tem(l)?' disabled':'')+'>'+esc(l.titulo)+' <small>· '+esc(l.autor||'')+' · '+L.GEN[L.genero(l.genero)]+'</small></button></li>').join('')+
        (q&&!r.length?'<li class="muted small">Nenhum livro encontrado na lista oficial.</li>':'')}
    $('busca').oninput=buscar;
    $('res').onclick=e=>{const b=e.target.closest('[data-livro]');if(b)add(livros.find(l=>l._id===b.dataset.livro))};

    /* ---------- datas ---------- */
    const nomePadrao=enc=>'Livro de '+V.mesDe(enc);
    let tituloMexido=false;
    $('nTitulo').oninput=()=>{tituloMexido=true};
    $('nEnc').onchange=()=>{const enc=$('nEnc').value;if(!enc||editando)return;
      $('nAbre').value=V.somaDias(enc,-6);$('nFecha').value=V.somaDias(enc,-1);if(!tituloMexido)$('nTitulo').value=nomePadrao(enc)};
    /* sugere o próximo encontro do livro do mês que está na agenda */
    db.collection('eventos').where('data','>=',L.hojeISO()).get().then(s=>{
      if(editando||$('nEnc').value)return;
      const ev=s.docs.map(d=>d.data()).filter(e=>e.tema==='livro').sort((a,b)=>a.data<b.data?-1:1)
        .find(e=>!vts.some(v=>v.encontro===e.data));
      if(ev){$('nEnc').value=ev.data;$('nEnc').onchange()}}).catch(e=>console.warn(e));

    function limpar(){editando=null;escolhidos=[];tituloMexido=false;['nEnc','nAbre','nFecha','nTitulo','busca'].forEach(k=>$(k).value='');
      $('novaT').textContent='Criar votação';$('nBtn').textContent='Criar votação';$('nCancel').hidden=true;
      $('esc').closest('.field').hidden=false;$('busca').closest('.busca').hidden=false;$('res').hidden=false;pintar();buscar();pintarSorteados()}
    function editarForm(v){
      editando=v._id;const travado=(votos[v._id]||[]).length>0;
      escolhidos=(v.opcoes||[]).map(o=>Object.assign({},o));tituloMexido=true;
      $('nEnc').value=v.encontro||'';$('nAbre').value=v.abre||'';$('nFecha').value=v.fecha||'';$('nTitulo').value=v.titulo||'';
      $('novaT').textContent='Mudar “'+(v.titulo||'votação')+'”';$('nBtn').textContent='Salvar mudanças';$('nCancel').hidden=false;
      /* com votos já dados, os livros não mudam (só as datas e o nome) */
      $('esc').closest('.field').hidden=travado;$('busca').closest('.busca').hidden=travado;$('res').hidden=travado;$('sorteados').hidden=travado||!sorteados.length;
      pintar();buscar();$('novaP').scrollIntoView({behavior:'smooth',block:'start'})}
    $('nCancel').onclick=limpar;

    $('nova').onsubmit=async ev=>{ev.preventDefault();
      const enc=$('nEnc').value,abre=$('nAbre').value,fecha=$('nFecha').value,titulo=$('nTitulo').value.trim()||nomePadrao(enc);
      if(!enc||!abre||!fecha){toast('Preencha as três datas');return}
      if(abre>fecha){toast('A abertura precisa ser antes do encerramento');return}
      if(fecha>=enc&&!confirm('A votação fecha no dia do encontro ou depois. Quer manter assim?'))return;
      if(escolhidos.length!==3){toast('Escolha os 3 livros');$('busca').focus();return}
      const d={titulo:titulo.slice(0,80),encontro:enc,abre,fecha,abreEm:TS.fromDate(V.inicioDia(abre)),fechaEm:TS.fromDate(V.fimDia(fecha))};
      const travado=editando&&(votos[editando]||[]).length>0;
      if(!travado)d.opcoes=escolhidos;
      const b=$('nBtn');b.disabled=true;
      try{if(editando){await col.doc(editando).update(d);toast('Votação atualizada')}
        else{await col.add(Object.assign(d,{criadoEm:FV.serverTimestamp()}));toast('Votação criada ✨')}
        limpar();window.scrollTo({top:0,behavior:'smooth'})}
      catch(er){console.warn(er);toast('Não foi possível salvar: '+er.code)}
      b.disabled=false};
    pintar();buscar();
  }
})();
</script>
</body>
</html>
