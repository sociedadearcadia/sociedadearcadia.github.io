<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Respostas · Lista de espera</title>
<meta name="theme-color" content="#170f33">
<link rel="icon" type="image/png" href="/selo-arcadia.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Lora:ital,wght@0,500;1,500&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
:root{--night:#170f33;--line:rgba(200,182,240,.25);--gold:#d6b46c;--lilac:#c9b6f2;--cream:#f4e8da;--muted:#b9acd6;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--cream);font:15px/1.5 "Nunito Sans",system-ui,sans-serif;background:radial-gradient(120% 70% at 50% 0%,#3a2a78,#24184e 38%,#170f33 75%) fixed,#170f33}
.wrap{max-width:760px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 16px 48px;display:flex;flex-direction:column;gap:16px}
h1{font-family:Lora,serif;font-style:italic;font-weight:500;font-size:30px;margin:0}
.lbl{font-family:"EB Garamond",serif;text-transform:uppercase;letter-spacing:.22em;color:#e8c98a;font-size:12px;margin:0}
.box{background:linear-gradient(180deg,rgba(43,23,72,.75),rgba(31,16,54,.85));border:1px solid rgba(214,180,108,.45);border-radius:14px;padding:18px}
.btn{font:700 15px "Nunito Sans",sans-serif;padding:11px 18px;border-radius:999px;border:0;cursor:pointer;background:linear-gradient(180deg,#e1d2ff,var(--lilac));color:var(--night);text-decoration:none;display:inline-flex}
.ghost{background:transparent;color:var(--cream);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
code{background:rgba(23,15,51,.8);padding:3px 8px;border-radius:6px;word-break:break-all;font-size:13px}
.item{display:flex;flex-direction:column;gap:6px}
.item h2{font-family:Lora,serif;font-size:19px;font-weight:500;margin:0}
.item dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0;font-size:14px}
.item dt{color:var(--muted)}.item dd{margin:0;overflow-wrap:anywhere}
.item a{color:var(--lilac)}
.del{align-self:flex-end;font:600 12px "Nunito Sans",sans-serif;color:#f2a0b8;background:none;border:0;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<main class="wrap">
  <div><p class="lbl">Sociedade Arcádia</p><h1>Respostas da lista de espera</h1></div>
  <div class="box" id="state"><p class="muted">Carregando…</p></div>
  <div id="list" class="wrap" style="padding:0"></div>
</main>
<script src="/config.js"></script>
<script>
(async function(){
  const $=id=>document.getElementById(id),st=$('state'),list=$('list');
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const load=src=>new Promise((ok,no)=>{const sc=document.createElement('script');sc.src=src;sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
  const V='10.12.2';
  await load(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);await load(`https://www.gstatic.com/firebasejs/${V}/firebase-auth-compat.js`);await load(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore-compat.js`);
  firebase.initializeApp(window.ARCADIA_FIREBASE);const auth=firebase.auth(),db=firebase.firestore();
  try{await auth.getRedirectResult()}catch(e){console.warn(e)}
  function login(){st.innerHTML='<p>Esta página é só para a administração do clube.</p><div class="row"><button class="btn" id="g">Entrar com Google</button></div>';
    $('g').onclick=async()=>{const p=new firebase.auth.GoogleAuthProvider();try{await auth.signInWithPopup(p)}catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')auth.signInWithRedirect(p);else st.insertAdjacentHTML('beforeend','<p class="muted">Não foi possível entrar: '+esc(e.code)+'</p>')}}}
  let rows=[];
  function csv(){const cols=['criadoEm','nome','nascimento','whatsapp','instagram','cidade','ritmo','generos','favoritos','clube','expectativas','origem'];
    const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
    const out=[cols.join(';')].concat(rows.map(r=>cols.map(c=>q(c==='generos'?(r.generos||[]).join(', '):c==='criadoEm'?(r.criadoEm?r.criadoEm.toDate().toLocaleString('pt-BR'):''):r[c])).join(';')));
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+out.join('\n')],{type:'text/csv'}));a.download='lista-de-espera.csv';a.click()}
  function render(){list.innerHTML=rows.map((r,i)=>{const n=(r.whatsapp||'').replace(/\D/g,'');
    return '<article class="box item"><p class="lbl">#'+(rows.length-i)+' · '+(r.criadoEm?esc(r.criadoEm.toDate().toLocaleString('pt-BR')):'')+'</p><h2>'+esc(r.nome)+'</h2><dl>'+
      '<dt>Nascimento</dt><dd>'+esc((r.nascimento||'').split('-').reverse().join('/'))+'</dd>'+
      '<dt>WhatsApp</dt><dd><a href="https://wa.me/55'+n+'" target="_blank" rel="noopener">'+esc(r.whatsapp)+'</a></dd>'+
      (r.instagram?'<dt>Instagram</dt><dd><a href="https://instagram.com/'+esc(r.instagram.replace('@',''))+'" target="_blank" rel="noopener">'+esc(r.instagram)+'</a></dd>':'')+
      '<dt>Campo Grande</dt><dd>'+esc(r.cidade)+'</dd><dt>Livros/mês</dt><dd>'+esc(r.ritmo)+'</dd><dt>Gêneros</dt><dd>'+esc((r.generos||[]).join(', '))+'</dd>'+
      (r.favoritos?'<dt>Favoritos</dt><dd>'+esc(r.favoritos)+'</dd>':'')+'<dt>Já fez clube</dt><dd>'+esc(r.clube)+'</dd>'+
      (r.expectativas?'<dt>Espera</dt><dd>'+esc(r.expectativas)+'</dd>':'')+'<dt>Conheceu por</dt><dd>'+esc(r.origem)+'</dd></dl>'+
      '<button class="del" data-id="'+esc(r._id)+'">Apagar resposta</button></article>'}).join('');
    list.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{if(!confirm('Apagar esta resposta para sempre?'))return;await db.collection('interessadas').doc(b.dataset.id).delete()})}
  auth.onAuthStateChanged(async u=>{
    if(!u||u.isAnonymous)return login();
    let admin=false;try{admin=(await db.collection('admins').doc(u.uid).get()).exists}catch(e){}
    if(!admin){st.innerHTML='<p>Você entrou como <b>'+esc(u.email)+'</b>, mas esta conta ainda não tem acesso.</p><p class="muted">Para liberar, no console do Firebase crie em Firestore a coleção <code>admins</code> com um documento cujo ID é:</p><p><code>'+esc(u.uid)+'</code></p><div class="row"><button class="btn ghost" id="out">Sair</button></div>';$('out').onclick=()=>auth.signOut();return}
    st.innerHTML='<div class="row"><span id="cnt" class="muted"></span><button class="btn" id="dl">Baixar planilha (CSV)</button><button class="btn ghost" id="out">Sair</button></div>';
    $('out').onclick=()=>auth.signOut();$('dl').onclick=csv;
    db.collection('interessadas').orderBy('criadoEm','desc').onSnapshot(s=>{rows=s.docs.map(d=>Object.assign({_id:d.id},d.data()));$('cnt').textContent=rows.length+' inscrições';render()},
      e=>{st.insertAdjacentHTML('beforeend','<p class="muted">Erro ao ler: '+esc(e.code)+'</p>')})});
})();
</script>
</body>
</html>
