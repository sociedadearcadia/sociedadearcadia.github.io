<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Chapéu Seletor · Salão Principal de Hogwarts</title>
<meta name="theme-color" content="#0b1730">
<link rel="icon" type="image/png" href="/selo-arcadia.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/hogwarts/hg.css">
<style>
.chapeu-anim{display:flex;justify-content:center;padding:10px 0}
.chapeu-anim .hg-ic{width:120px;height:120px;color:#7a4a12;transform-origin:50% 90%}
.chapeu-anim.mexe .hg-ic{animation:mexe 1.1s ease-in-out 2}
@keyframes mexe{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-8deg) scale(1.04)}50%{transform:rotate(6deg) scale(1.08)}75%{transform:rotate(-4deg) scale(1.03)}}
.carta{border:2px double #a87d36;border-radius:12px;padding:18px;background:rgba(255,250,236,.6)}
.carta .nome{font:700 clamp(24px,6vw,32px) var(--titulo);color:#5a2a0c;text-align:center;margin:10px 0}
.carta ul{margin:6px 0 0;padding-left:20px}
.carta li{margin:4px 0}
@media (prefers-reduced-motion:reduce){.chapeu-anim.mexe .hg-ic{animation:none}}
</style>
</head>
<body>
<div class="hg-fundo" aria-hidden="true"></div>
<main class="hg-wrap">
  <a class="hg-voltar" href="/hogwarts/">← Salão Principal</a>
  <section class="hg-perg hg-form" id="caixa">
    <div class="hg-topo"><span style="color:#7a4a12" id="icTopo"></span><p class="hg-lbl" style="color:#7a4a12">Missão de Hogwarts</p><h1 style="color:#4a2f0f">Chapéu Seletor</h1></div>
    <p class="hg-centro hg-muted" id="estado">Carregando…</p>
  </section>
</main>
<script src="/config.js"></script>
<script src="/hogwarts/hg.js"></script>
<script>
(async()=>{
  const {$,esc,icone,casaIc,CASAS,PERSONAGENS,janela,fmtD}=HG;HG.neve();HG.velas();$('icTopo').innerHTML=icone('chapeu','hg-ic-grande');
  let ctx;try{ctx=await HG.entrar()}catch(e){$('estado').textContent='Sem conexão agora. Verifique a internet e recarregue a página.';return}
  const db=ctx.db,cx=$('caixa'),topo=cx.querySelector('.hg-topo').outerHTML;
  const INSTR=`<div class="hg-instr"><b>Como funciona:</b> cada uma das oito integrantes recebe, por sorteio, um personagem diferente do primeiro livro. Acompanhe esse personagem durante a leitura e conte suas impressões no encontro de encerramento (19/12). A casa não interfere no sorteio, e o sorteio não pode ser repetido.</div>`;
  const j=janela(ctx.datas,'chapeu');
  let meu=null;try{const d=await db.collection('hgSorteio').doc(ctx.pid).get();meu=d.exists?d.data():null}catch(e){}
  function carta(p){cx.innerHTML=topo+`<div class="carta"><p class="hg-lbl hg-centro" style="color:#7a4a12">O Chapéu Seletor revelou sua missão!</p>
    <p class="hg-centro" style="margin-top:8px">Seu personagem é:</p><p class="nome">${esc(PERSONAGENS[p]||p)}</p>
    <p>Durante a leitura de <i>Harry Potter e a Pedra Filosofal</i>, acompanhe esse personagem com atenção. Observe suas atitudes, escolhas e desenvolvimento.</p>
    <p style="margin-top:8px">No encontro de encerramento, queremos saber suas impressões!</p>
    <p style="margin-top:12px"><b>Perguntas para guiar sua leitura</b></p>
    <ul><li>Qual foi sua primeira impressão?</li><li>Quais atitudes chamaram sua atenção?</li><li>Alguma cena mudou sua opinião?</li><li>Como descreveria esse personagem ao terminar o livro?</li></ul>
    <p class="hg-muted hg-small" style="margin-top:10px">Não precisa escrever nada no site: a missão é apresentada de viva voz no encontro de 19/12.</p></div>
    <p class="hg-centro hg-small">${casaIc(ctx.casa)} ${esc(ctx.nome)} · ${esc(CASAS[ctx.casa]?CASAS[ctx.casa].n:'')}</p>
    <div class="hg-btns"><a class="hg-btn sec" href="/hogwarts/">Voltar ao Salão Principal</a></div>`}
  if(meu)return carta(meu.personagem);
  if(!j.aberta){cx.innerHTML=topo+INSTR+`<p class="hg-centro"><span class="hg-tag">${esc(j.txt||'Em breve')}</span></p>`;return}
  /* etapa 1: identificação; etapa 2: casa; etapa 3: sorteio */
  function tela(){cx.innerHTML=topo+INSTR+`
    <p class="hg-lbl" style="color:#7a4a12">1. Identificação</p>
    <p>Você está participando como <b>${esc(ctx.nome)}</b>. Se não for você, <a href="#" id="naoSou">saia e entre com o seu código</a>.</p>
    <p class="hg-lbl" style="color:#7a4a12">2. Sua casa de Hogwarts</p>
    <div id="casaBox"></div>
    <p class="hg-lbl" style="color:#7a4a12">3. Sorteio</p>
    <div class="chapeu-anim" id="anim">${icone('chapeu')}</div>
    <p class="hg-erro" id="erro" hidden></p>
    <div class="hg-btns"><button class="hg-btn" id="revelar" ${ctx.casa?'':'disabled'}>Revelar minha missão</button></div>`;
    $('naoSou').onclick=e=>{e.preventDefault();HG.sair()};
    $('casaBox').innerHTML=ctx.casa?`<div id="b3dCasa"></div><p class="hg-centro"><b>${esc(CASAS[ctx.casa].n)}</b> <span class="hg-muted hg-small">(${esc(CASAS[ctx.casa].a)})</span></p>`
      :`<p>Informe sua casa para liberar o sorteio.</p><div class="hg-btns" style="justify-content:flex-start;margin-top:8px"><button class="hg-btn peq" id="casaBt">Informar minha casa</button></div>`;
    if(ctx.casa)HG.brasao3d($('b3dCasa'),ctx.casa,{tam:150});
    if(!ctx.casa)$('casaBt').onclick=async()=>{await HG.pedirCasa(ctx,{titulo:'Qual é a sua casa de Hogwarts?'});tela()};
    $('revelar').onclick=sortear}
  async function sortear(){const bt=$('revelar');bt.disabled=true;$('erro').hidden=true;$('anim').classList.add('mexe');const t0=Date.now();
    let p=null;
    for(let tent=0;tent<8&&!p;tent++){
      let usados=[];try{usados=(await db.collection('hgPersonagens').get()).docs.map(d=>d.id)}catch(e){}
      const livres=Object.keys(PERSONAGENS).filter(k=>!usados.includes(k));
      if(!livres.length){$('erro').textContent='Todos os personagens já foram sorteados. Fale com a administração.';$('erro').hidden=false;$('anim').classList.remove('mexe');return}
      const esc_=livres[Math.floor(crypto.getRandomValues(new Uint32Array(1))[0]/4294967296*livres.length)];
      try{const w=db.batch();w.set(db.collection('hgSorteio').doc(ctx.pid),{personagem:esc_,em:Date.now()});w.set(db.collection('hgPersonagens').doc(esc_),{em:Date.now()});await w.commit();p=esc_}
      catch(e){console.warn(e);try{const d=await db.collection('hgSorteio').doc(ctx.pid).get();if(d.exists)p=d.data().personagem}catch(e2){}}}
    if(!p){$('anim').classList.remove('mexe');$('erro').textContent='Não deu para sortear agora. Confira a internet e tente de novo.';$('erro').hidden=false;bt.disabled=false;return}
    setTimeout(()=>carta(p),Math.max(0,2300-(Date.now()-t0)))}
  tela();
})();
</script>
</body>
</html>
