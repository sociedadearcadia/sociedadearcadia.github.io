<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Administração · Mensagens para a administração</title>
<meta name="theme-color" content="#170f33">
<link rel="icon" type="image/png" href="/selo-arcadia.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Lora:ital,wght@0,400;0,500;0,600;1,500&family=Nunito+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/fx.css">
<link rel="stylesheet" href="/leitura/leitura.css">
<link rel="stylesheet" href="/livros/livros.css">
<link rel="stylesheet" href="/redes/redes.css">
<link rel="stylesheet" href="../mensagem.css">
</head>
<body>
<div class="scene" id="scene" aria-hidden="true" style="background-image:none"><div class="art" id="art"></div></div>
<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="petals" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<main class="wrap">
  <div class="row" style="justify-content:space-between"><a class="back" href="../">← Fale com a administração</a><a class="back" href="/admin/">Painel da administração</a></div>
  <section class="panel arch">
    <div class="top">
      <img class="seal" src="/selo-arcadia.png" alt="" width="72" height="72">
      <p class="lbl">Mensagens das integrantes</p>
      <h1>Administração</h1>
    </div>
    <div id="state" style="margin-top:14px;text-align:center"><p class="muted">Carregando…</p></div>
  </section>

  <div id="area" hidden style="display:flex;flex-direction:column;gap:16px">
    <section class="panel">
      <p class="lbl">Para ler</p>
      <h2>Novas<span class="badge" id="novN" hidden></span></h2>
      <ul class="sugs" id="nov"><li class="muted small">Carregando…</li></ul>
    </section>
    <section class="panel">
      <p class="lbl">Histórico</p>
      <h2>Lidas</h2>
      <ul class="sugs" id="lid"></ul>
    </section>
    <div class="row" style="justify-content:center"><button class="btn ghost" type="button" id="sair">Sair da conta</button></div>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>window.ARC_SET={largo:'banner',alto:'frame'}</script>
<script src="/fx.js"></script>
<script src="/config.js"></script>
<script src="/sprint/config.js"></script>
<script src="/livros/comum.js"></script>
<script src="../comum.js"></script>
<script>
(async function(){
  const $=id=>document.getElementById(id),st=$('state');
  const L=window.LIVROS,{esc}=L,M=window.MENSAGEM;
  const CFG=window.ARCADIA_CONFIG||{};
  let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2800)}
  const data=ts=>ts&&ts.toDate?ts.toDate().toLocaleDateString('pt-BR'):'';

  const load=src=>new Promise((ok,no)=>{const sc=document.createElement('script');sc.src=src;sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
  const V='10.12.2';
  try{await load(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);await load(`https://www.gstatic.com/firebasejs/${V}/firebase-auth-compat.js`);await load(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore-compat.js`)}
  catch(e){st.innerHTML='<p class="muted">Sem conexão agora. Recarregue a página.</p>';return}
  // app separado: o login de administração não mexe no acesso de integrante deste aparelho
  const app=firebase.initializeApp(window.ARCADIA_FIREBASE||CFG.firebase,'admin');const auth=app.auth(),db=app.firestore();
  try{await auth.getRedirectResult()}catch(e){console.warn(e)}

  function login(){$('area').hidden=true;
    st.innerHTML='<p>Esta parte é só para a administração do clube.</p><button class="btn" id="g">Entrar com Google</button>';
    $('g').onclick=async()=>{const p=new firebase.auth.GoogleAuthProvider();try{await auth.signInWithPopup(p)}
      catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')auth.signInWithRedirect(p);
        else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')st.insertAdjacentHTML('beforeend','<p class="muted small">Não foi possível entrar: '+esc(e.code)+'</p>')}}}
  $('sair').onclick=()=>auth.signOut();

  let iniciou=false;
  auth.onAuthStateChanged(async u=>{
    if(!u||u.isAnonymous)return login();
    // só a administração principal (o conselho não lê estas mensagens)
    let admin=false;try{admin=(await db.collection('admins').doc(u.uid).get()).exists}catch(e){}
    if(!admin){$('area').hidden=true;st.innerHTML='<p>Você entrou como <b>'+esc(u.email)+'</b>, mas esta conta não tem acesso às mensagens.</p><p class="muted small">As mensagens são só para a administração principal do clube.</p><button class="btn ghost" id="out">Sair</button>';$('out').onclick=()=>auth.signOut();return}
    st.innerHTML='<p class="muted small" style="margin:0">Conectada como '+esc(u.email)+'</p>';$('area').hidden=false;
    if(!iniciou){iniciou=true;iniciar()}
  });

  function iniciar(){
    const col=db.collection('mensagens');let todas=[],editando=null;
    col.onSnapshot(s=>{todas=s.docs.map(d=>Object.assign({_id:d.id},d.data()));desenhar()},
      e=>{console.warn(e);toast('Erro ao ler as mensagens: '+e.code)});

    function card(x){
      const anon=!x.nome;
      return '<li class="sug '+M.cls(x.tipo)+'" data-id="'+esc(x._id)+'">'+
        '<div class="topo">'+M.tag(x.tipo)+(anon?'<span class="st anon">Sem nome</span>':'<span class="st '+(x.lida?'lida':'nova')+'">'+(x.lida?'Lida':'Nova')+'</span>')+'</div>'+
        '<p class="por">'+(anon?'Enviada sem nome':'De <b style="color:var(--cream)">'+esc(x.nome)+'</b>')+(data(x.criadoEm)?' em '+data(x.criadoEm):'')+'</p>'+
        '<p class="txt">'+esc(x.texto)+'</p>'+
        (editando===x._id
          ?'<label style="margin-top:8px">Resposta <small>Só ela vê, na página, no aparelho em que mandou.</small><textarea data-resp rows="3" maxlength="'+M.MAX.resposta+'">'+esc(x.resposta||'')+'</textarea></label>'+
           '<div class="acoes"><button class="btn" type="button" data-acao="salvar">Salvar resposta</button><button class="btn ghost" type="button" data-acao="cancelar">Cancelar</button></div>'
          :(x.resposta?'<p class="nota"><b>Sua resposta:</b> '+esc(x.resposta)+'</p>':'')+
           '<div class="acoes">'+(x.lida?'':'<button class="btn ok" type="button" data-acao="ler">Marcar como lida</button>')+'</div>'+
           '<div class="ed">'+(anon?'':'<button class="lnk" type="button" data-acao="editar">'+(x.resposta?'Mudar resposta':'Responder')+'</button>')+
           (x.lida?'<button class="lnk" type="button" data-acao="naolida">Voltar para novas</button>':'')+
           '<button class="del" type="button" data-acao="apagar">Apagar</button></div>')+
        '</li>'}

    function desenhar(){
      const nov=todas.filter(x=>!x.lida).sort(M.recentes),lid=todas.filter(x=>x.lida).sort(M.recentes);
      $('novN').hidden=!nov.length;$('novN').textContent=nov.length;
      $('nov').innerHTML=nov.length?nov.map(card).join(''):'<li class="muted small">Nenhuma mensagem nova.</li>';
      $('lid').innerHTML=lid.length?lid.map(card).join(''):'<li class="muted small">Nenhuma ainda.</li>'}

    document.addEventListener('click',async e=>{const b=e.target.closest('[data-acao]');if(!b)return;
      const li=b.closest('[data-id]');if(!li)return;const id=li.dataset.id,x=todas.find(y=>y._id===id);if(!x)return;
      const a=b.dataset.acao;
      if(a==='editar'){editando=id;desenhar();return}
      if(a==='cancelar'){editando=null;desenhar();return}
      b.disabled=true;
      try{
        if(a==='ler'){await col.doc(id).update({lida:true});toast('Marcada como lida')}
        else if(a==='naolida'){await col.doc(id).update({lida:false});toast('Voltou para novas')}
        else if(a==='salvar'){const ta=li.querySelector('[data-resp]');await col.doc(id).update({resposta:ta?ta.value.trim():'',lida:true});editando=null;desenhar();toast('Resposta salva')}
        else if(a==='apagar'){if(!confirm('Apagar esta mensagem? Não dá para desfazer.')){b.disabled=false;return}
          await col.doc(id).delete();toast('Apagada')}
      }catch(er){console.warn(er);toast('Não foi possível agora: '+er.code);b.disabled=false}});
  }
})();
</script>
</body>
</html>
