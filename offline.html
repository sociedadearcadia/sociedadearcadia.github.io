<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sem internet · Sociedade Arcádia</title>
<meta name="theme-color" content="#170f33">
<style>
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 30%,#3a1d66,#170f33 70%);color:#f4e8da;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
img{width:96px;height:96px;border-radius:50%;box-shadow:0 0 0 1px #d6b46c,0 0 34px rgba(201,182,242,.4)}
h1{font:italic 500 28px Georgia,serif;margin:6px 0 0}
p{margin:0;color:#c3b6de;max-width:320px}
button{margin-top:8px;font:700 15px system-ui,sans-serif;padding:12px 22px;border-radius:999px;border:0;background:linear-gradient(180deg,#e1d2ff,#c9b6f2);color:#170f33}
</style>
</head>
<body>
<main>
  <img src="/selo-arcadia.png" alt="">
  <h1>Sem internet agora</h1>
  <p>O app da Arcádia precisa de conexão. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
  <button onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
